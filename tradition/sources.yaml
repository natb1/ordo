    date: 2001
    domain: practitioner
    peer_reviewed: false
    supports: >
      The canonical treatment of captured-but-unscheduled work: open loops cost
      attention until they are written somewhere trusted, and a capture that is not
      trusted is not a capture.
    verified: unverified
    note: >
      A practitioner book, not scholarship, and included on those terms. Its central
      mechanism is not Allen's own finding — the evidence is ZEIGARNIK-1927 and
      MASICAMPO-2011, which show the intrusion and that a PLAN (not a list) discharges
      it. Cite those for the claim; cite this for the practice.

