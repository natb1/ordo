      and an output, the loops nested so that a higher level's output is a lower level's
      reference, attention going to the level most in error, and the rate of closing
      felt as doing well or badly. The optimizable form of the Rule's goal, and the
      reason a review acts on a trend. hypomnemata › Carver, alignment, horizon.
    verified: unverified

