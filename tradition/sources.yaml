    work: "The Experience Sampling Method"
    author: Larson, R., & Csikszentmihalyi, M.
    venue: New Directions for Methodology of Social and Behavioral Science 15, 41–56, ed. H. T. Reis, Jossey-Bass
    date: 1983
    domain: psychology
    supports: >
      A pager signals at random moments and the subject reports what is happening
