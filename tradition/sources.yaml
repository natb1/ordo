# Versioned registry of every appeal to tradition made anywhere in this repo.
#
# Rule: no claim in README.md, SKILL.md, any reference, the Rule (the documents in the
# Cadence page's store; tools/fixture/rule is a frozen copy) or the hypomnemata may rest
# on a source that is not registered here. Each is cited by key, `[KEY]`;
# `tradition/check.py` fails if a key is used but not defined.
#
# The `verified` field is the point of this file. Values:
#   web-YYYY-MM-DD  checked against a primary or reputable secondary source on that date
#   unverified      drawn from model knowledge, NOT independently checked — treat as a lead
#   disputed        checked and found wrong, or commonly misattributed. See `status`.
#
# An unverified entry is not necessarily wrong. It is un-audited. If a claim in the
# Rule is doing real work, promote its source to verified before trusting it.

sources:

  # ---- Monastic: transition, the bell, the ration -------------------------

  RB-5:
    work: The Rule of St. Benedict
    locus: Ch. 5, On Obedience
    date: c. 530
    domain: monastic
    quote: "dropping the work they were engaged in and leaving it unfinished"
    supports: >
      The exit rite. Leaving work unfinished at the signal is prescribed, not
      merely tolerated — the load-bearing citation for the exit rite (hypomnemata › bell).
    verified: web-2026-09-21
    note: Confirmed against Project Gutenberg text of the Rule.

  RB-35:
    work: The Rule of St. Benedict
    locus: Ch. 35, Weekly Kitchen Servers
    date: c. 530
    domain: monastic
    supports: Chores as rotating office, no exemptions. Kitchen work is assigned, not left over.
    verified: web-2026-09-21

  RB-40:
    work: The Rule of St. Benedict
    locus: Ch. 40, The Measure of Drink
    date: c. 530
    domain: monastic
    quote: "although we read that wine is altogether not for monks, it is impossible in our times to persuade monks of this"
    supports: >
      Rationing over prohibition. A measured daily allowance (a hemina), drunk
      "sparingly and not to satiety," adjustable by the abbot, with abstainers
      having "their own reward." The model for the drink ration (hypomnemata › count).
    verified: web-2026-09-21

  RB-43:
    work: The Rule of St. Benedict
    locus: Ch. 43, On Those Who Come Late
    date: c. 530
    domain: monastic
    quote: "abandon whatever they may have in hand and hasten with the greatest speed"
    supports: The bell has authority independent of the task's state.
    verified: web-2026-09-21

  RB-47:
    work: The Rule of St. Benedict
    locus: Ch. 47, Announcing the Hours for the Work of God
    date: c. 530
    domain: monastic
    quote: "The indicating of the hour for the Work of God by day and by night shall devolve upon the Abbot, either to give the signal himself or to assign this duty to such a careful brother that everything will take place at the proper hours."
    supports: >
      ONE person owns the clock so that nobody else has to watch it. The monk is
      freed from timekeeping — that freedom is the gift of the horarium, not an
      incidental detail. Grounds the rule that a countdown is available on demand
      but never ambient: a visible ticking clock reinstates exactly the vigilance
      the bell exists to remove.
    verified: web-2026-09-21

  SENECA-BREV:
    work: De Brevitate Vitae
    author: Seneca
    domain: stoic
    supports: >
      Time is squandered by inattention, not by shortage. The counterweight to RB-47:
      the answer is a reliable signal, not indifference to the hour.
    verified: unverified

  RB-48:
    work: The Rule of St. Benedict
    locus: Ch. 48, Daily Manual Labour
    date: c. 530
    domain: monastic
    quote: "Idleness is the enemy of the soul"
    supports: >
      Breadth of activity is produced by assigning fixed hours, not by intention.
      Directly addresses "correct breadth of productivity through the day."
    verified: web-2026-09-21

  RB-49:
    work: The Rule of St. Benedict
    locus: Ch. 49, The Observance of Lent
    date: c. 530
    domain: monastic
    supports: >
      A declared season — deviation announced in advance, under authority, fully
      inside the Rule. Origin of the dispensation/lapse distinction, hypomnemata › deviation.
    verified: unverified

  RB-58:
    work: The Rule of St. Benedict
    locus: Ch. 58, The Reception of Brothers
    date: c. 530
    domain: monastic
    supports: >
      The novitiate. A postulant is turned away, made to wait, then given months of
      probation with the Rule read aloud and the cost stated before entry — admission
      on demonstrated capacity, never on enthusiasm. The model for the backlog gate
      and the novitiate state, hypomnemata › gate.
    verified: unverified
    note: >
      Probation periods (commonly given as two months, then six, then four) are from
      memory and should be checked before being quoted as specifics.

  RB-64:
    work: The Rule of St. Benedict
    locus: Ch. 64, The Election of an Abbot
    date: c. 530
    domain: monastic
    quote: "discretion, the mother of virtues"
    supports: >
      Arrange things "so that the strong have something to yearn for and the weak
      nothing to run from." The anti-perfectionism clause.
    verified: unverified

  RB-73:
    work: The Rule of St. Benedict
    locus: Ch. 73
    date: c. 530
    domain: monastic
    quote: "a little rule for beginners"
    supports: Benedict deprecating his own Rule in its final chapter.
    verified: unverified

  RB-43-LETTER:
    work: Commonly attributed to the Rule of St. Benedict
    locus: "(none — not in the Rule)"
    domain: monastic
    status: REJECTED
    claim: >
      That a monk hearing the bell must not "even finish the letter he is writing."
    supports: Nothing. Retained so the error is not reintroduced.
    verified: disputed
    note: >
      Searched 2026-09-21; not present in Ch. 43 or elsewhere in the Rule. A later
      commentarial gloss. Cite RB-5 and RB-43 for the substance instead.

  RB-31:
    work: The Rule of St. Benedict
    locus: Ch. 31, The Cellarer of the Monastery
    date: c. 530
    domain: monastic
    supports: >
      A named office exists for the material problems of the house, so that breakdowns
      have an owner and do not compete with the horarium for attention. The argument
      that infrastructure failure belongs INSIDE the Rule, with its own handling,
      rather than being an exception to it.
    verified: unverified

  RB-32:
    work: The Rule of St. Benedict
    locus: Ch. 32, The Tools and Goods of the Monastery
    date: c. 530
    domain: monastic
    supports: >
      Tools are inventoried and assigned; the abbot keeps a list and checks it. The
      precedent for a written breakdown register rather than remembering what is broken.
    verified: web-2026-09-21
    note: Chapter title and the tool-list practice confirmed alongside the RB-35/43/48 check.

  MARCUS-5.20:
    work: Meditations
    author: Marcus Aurelius
    locus: 5.20
    domain: stoic
    quote: "The impediment to action advances action. What stands in the way becomes the way."
    supports: >
      The obstacle is handled by the same faculty that handles everything else — it
      does not require suspending the Rule. Grounds treating a breakdown as ordinary
      Rule business with its own slot.
    verified: web-2026-09-21
    note: >
      CAUTION. The punchy wording is Gregory Hays's 2002 translation, not a literal
      rendering. George Long (1862) has "that which is an obstacle on the road helps
      us on this road." The thought is Marcus's; the epigram is the translator's.
      Attribute as "Marcus, in Hays's translation" — never as Marcus's own words.

  EPICTETUS-ENCH-1:
    work: Enchiridion
    author: Epictetus
    locus: 1
    domain: stoic
    supports: >
      The dichotomy of control. The machine breaking is not up to you; the response,
      the slot you give it, and whether it becomes a verdict are.
    verified: unverified

  SENECA-PREMEDITATIO:
    work: Letters to Lucilius (esp. Ep. 91) and Ad Marciam
    author: Seneca
    domain: stoic
    supports: >
      Premeditatio malorum — rehearsing misfortune in advance so its arrival does not
      destabilize. The case for the Rule carrying a breakdown CATEGORY, built before
      anything breaks, rather than improvising at each failure.
    verified: unverified

  RUSSELL-VINSEL-2016:
    work: "Hail the Maintainers"
    author: Russell, A. L., & Vinsel, L.
    venue: Aeon, 7 April 2016
    date: 2016
    domain: history-of-technology
    subtitle: "Capitalism excels at innovation but is failing at maintenance, and for most lives it is maintenance that matters more."
    supports: >
      Maintenance and repair have more effect on daily life than most innovation, and
      are systematically undervalued. The modern companion to DOGEN-TENZO: a repair is
      not an interruption of real work, it is the larger share of real work.
    verified: web-2026-09-21
    note: Essay, not peer-reviewed. Expanded into The Innovation Delusion (2020).

  DOGEN-TENZO:
    work: Tenzo Kyokun (Instructions for the Cook)
    author: Dogen
    date: 1237
    domain: zen
    supports: >
      The cook's work IS the practice, entire — not preparation for it and not a
      lesser substitute. The argument against filing chores as interruptions.
    verified: unverified

  GREAT-SILENCE:
    work: Monastic custom following Compline
    domain: monastic
    supports: >
      After Compline the day's business is closed; what follows is silence. The device
      for bedtime drift — the Examen ends the day, so the 21:00-23:00 window is
      declared leisure rather than unfinished day.
    verified: unverified
    note: A widespread custom across orders rather than a specific chapter of the Rule.

  SHUHARI:
    work: Shu-ha-ri
    domain: japanese-arts-pedagogy
    supports: >
      Obey the form, detach from it, transcend it. Governs how much variation to
      allow: strictly at first, adaptively much later.
    verified: unverified
    note: Origins commonly traced to Noh and tea practice; attribution is loose.

  RB-3:
    work: The Rule of St. Benedict
    locus: Ch. 3, On Calling the Brethren for Counsel
    date: c. 530
    domain: monastic
    quote: "Whenever any important business has to be done in the monastery, let the Abbot call together the whole community"
    supports: >
      Where a conflict in the Rule or between principles is settled: what blocks is
      settled when it blocks, with the least that unblocks; the rest waits for the
      review above it, where the whole matter is put, counsel heard, and the one who
      decides decides on level ground (hypomnemata › gate).
    verified: web-2026-10-27
    note: >
      Confirmed against Project Gutenberg's text of the Rule in Leonard J. Doyle's
      translation (Liturgical Press, 1948), Chapter 3: the abbot states the matter,
      hears the brethren's advice, then "turn[s] the matter over in his own mind"
      and decides.

  # ---- Review: looking at the day without a verdict ------------------------

  PYTHAG-GV-40:
    work: Golden Verses
    attributed_to: Pythagoras
    locus: lines 40-44
    domain: hellenic
    quote: "Let not sleep close thy eyes before thrice reviewing the deeds of the day"
    supports: The oldest form of the evening review. Three fixed questions.
    verified: unverified

  SENECA-IRA-3.36:
    work: De Ira
    author: Seneca
    locus: Book III, 36
    domain: stoic
    quote: "I examine my entire day and go back over what I have done and said, hiding nothing from myself, passing nothing by"
    supports: >
      The nightly review, taken from Sextius. Crucially Seneca is a judge who then
      PARDONS — the review is not the punishment. The shame-management citation.
    verified: unverified

  MARCUS-5.1:
    work: Meditations
    author: Marcus Aurelius
    locus: 5.1
    domain: stoic
    supports: >
      The morning rising passage. He reminds himself what the day is for rather
      than scolding himself out of bed.
    verified: unverified

  ANALECTS-1.4:
    work: Analects
    author: Confucius (Zengzi)
    locus: I.4
    domain: confucian
    quote: "Daily I examine myself on three points"
    supports: Fixed, short, enumerated self-examination. Short lists survive; open-ended reflection ruminates.
    verified: unverified

  EVAGRIUS-PRAKTIKOS-12:
    work: Praktikos
    author: Evagrius Ponticus
    date: c. 390
    locus: chapter 12
    domain: christian-spirituality
    supports: >
      Acedia, the noonday demon: the thought that comes about the ninth hour, when the
      day's labour thins; the monk looks out of the window, counts the hours to the
      meal, finds the cell hateful and is moved to leave. The Rule's name for the Sunday
      evening after the game. hypomnemata › Evagrius, allocation, unprompted.
    verified: unverified

  EVAGRIUS-PRAKTIKOS-28:
    work: Praktikos
    author: Evagrius Ponticus
    date: c. 390
    locus: chapter 28 (the locus is the less certain of the two; the remedy may be
      stated in chapter 12 itself, or in the Antirrhetikos)
    domain: christian-spirituality
    supports: >
      The remedy for acedia is endurance where one is: stay in the cell and keep the
      hours, and do not argue with the thought. The reason the Rule meets the Sunday
      evening with architecture and a bell rather than resolve. hypomnemata › Evagrius.
    verified: unverified

  IGNATIUS-EXAMEN:
    work: Spiritual Exercises
    author: Ignatius of Loyola
    date: 1548
    domain: christian-spirituality
    supports: >
      The Examen: five steps, fixed order, GRATITUDE FIRST, before any review of
      faults. Also consolation/desolation as a vocabulary for emotional movement.
    verified: unverified

  IGNATIUS-DISCERN-5:
    work: Spiritual Exercises, Rules for Discernment
    author: Ignatius of Loyola
    locus: Rule 5 (first week)
    domain: christian-spirituality
    quote: "In time of desolation never make a change"
    supports: >
      The negative gate on the backlog: never promote a goal, and never abandon one,
      during a bad week. hypomnemata › gate.
    verified: unverified

  IGNATIUS-PARTICULAR:
    work: Spiritual Exercises
    author: Ignatius of Loyola
    date: 1548
    locus: the particular examen, Exercises 24-31
    domain: christian-spirituality
    supports: >
      One fault at a time, chosen and marked on a grid twice daily, the second day
      compared to the first and the second week to the first: every count read as a
      trend and never an absolute, and a sitting's attention on one gap a week.
      hypomnemata › Ignatius, horizon.
    verified: unverified

  FRANKLIN-AUTO:
    work: Autobiography
    author: Benjamin Franklin
    date: 1791
    domain: practical-ethics
    supports: >
      The thirteen virtues and the grid — the original habit tracker. The method
      matters more than the list: ONE virtue per week, the rest let go. Also the
      speckled axe, and his admission he never came close to the scheme.
    verified: unverified

  LEFIN-1808:
    work: Cheshbon HaNefesh
    author: Menachem Mendel Lefin
    date: 1808
    domain: mussar
    supports: >
      The "accounting of the soul," explicitly built on Franklin's grid. One trait at
      a time, written down. Independent arrival at the same technique.
    verified: unverified

  HADOT-1995:
    work: Philosophy as a Way of Life
    author: Pierre Hadot
    date: 1995
    domain: history-of-philosophy
    supports: >
      Ancient philosophy as daily spiritual exercises — an askesis — rather than
      doctrine. The scholarly frame for the whole project.
    verified: unverified

  FOUCAULT-1982:
    work: Technologies of the Self
    author: Michel Foucault
    date: 1982
    domain: philosophy
    supports: Epimeleia heautou, and the hypomnemata — notebooks of self-record. The genealogy of the record (the store's days).
    verified: unverified

  PLATO-MENO-71B:
    work: Meno (71b), with Euthyphro (5c-d)
    author: Plato
    domain: hellenic
    supports: >
      What a thing is (ti esti) is asked before what it is like, and it is asked of
      someone already doing the thing. The form of the root question of the
      hypomnemata, which this repo borrows from natb1/CanonDB; cited from the
      notebook's Plato tab and nowhere in the repo.
    verified: unverified
    note: >
      Added with the notebook. Drawn from model knowledge; CanonDB's reconstruction
      of the same party reports the Stephanus references checked, but that audit is
      another repo's and does not count here. Promote before leaning on it.

  IGNATIUS-ELECTION:
    work: The Spiritual Exercises
    locus: Second Week, "Three times for making, in any one of them, a sound and good election", and the first way, its first two points
    author: Ignatius of Loyola
    date: 1548
    domain: christian-spirituality
    quote: "The third time is quiet, when one considers, first, for what man is born"
    supports: >
      A change to the order or to the Rule is made in a quiet time and not under the
      movement of the moment, and by one measure, what is more conducive to the end
      one is made for, held "like the middle of a balance": the sort by the ends, and
      a conflict settled on level ground (hypomnemata › allocation, › gate).
    verified: web-2026-10-27
    note: >
      Confirmed against the 1914 English translation (Elder Mullan's) as sacred-texts
      publishes it, the Second Week's election: the three times, and the first way's
      second point, which keeps "as aim the end for which I am created".

  # ---- The end: what the counts serve ---------------------------------------

  CASSIAN-CONF-1:
    work: The Conferences
    locus: Conference I, 2–5, Abba Moses on the monk's end and his mark
    author: John Cassian
    date: c. 420
    domain: monastic
    supports: >
      Every craft has a mark it aims at and an end the mark serves, and the one who
      takes the mark for the end goes astray. Each horizon's count is a mark, and what
      the marks serve is the end the root states (hypomnemata › horizon, › ti-esti).
    verified: unverified

  AQUINAS-ST-1-2-1:
    work: Summa Theologiae
    locus: I-II q.1 a.1, with ad 1, the treatise on the last end
    author: Thomas Aquinas
    date: 1265–1274
    domain: scholastic
    supports: >
      The end is first in the order of intention and last in the order of execution,
      so it is stated before a horizon is decided for and read after it (hypomnemata › horizon).
    verified: unverified

  CASSIAN-CONF-1.5:
    work: The Conferences
    locus: Conference I, 5–7, Abba Moses on what serves the mark and what is left off
    author: John Cassian
    date: c. 420
    domain: monastic
    quote: "Whatever then can help to guide us to this object; viz., purity of heart, we must follow with all our might"
    supports: >
      Discretion by the mark: every practice is judged by whether it serves the mark,
      kept while it does and left off where it hinders, the secondary thing never
      taken for the end. The sort's levels read each project the same way, against
      the end its root states and as a threshold, never a maximization
      (hypomnemata › allocation).
    verified: web-2026-10-27
    note: >
      Confirmed against Gibson's translation (Nicene and Post-Nicene Fathers, second
      series, vol. 11) at New Advent, Conference I chapters 4–7: fasting, vigils and
      the rest are secondary, practised for the main object, and given up where they
      stand in its way. CASSIAN-CONF-1 covers the end and the mark themselves.

  ARISTOTLE-TOPICS-1.2:
    work: Topics
    locus: I.2, 101a34–b4, the third use of dialectic
    author: Aristotle
    date: c. 350 BC
    domain: hellenic
    quote: "for dialectic is a process of criticism wherein lies the path to the principles of all inquiries"
    supports: >
      The first principles of a science cannot be examined from inside it, so they
      are reached by dialectic, by questioning what is held: the derivation reading
      that puts the archai root's question to the user again is that road, and it is
      why the order is refined by a question and never by a count (the archai root).
    verified: web-2026-10-27
    note: Confirmed against Pickard-Cambridge's translation at the MIT classics archive, Topics I.2.

  RAWLS-1971-RE:
    work: A Theory of Justice
    locus: §4 and §9, reflective equilibrium
    author: John Rawls
    date: 1971
    domain: ethics
    supports: >
      Principles and considered judgements are adjusted against each other until they
      agree. The archai root's method takes the form and slows it to one direction at
      a time: what cannot be derived from the order is the finding, and the order
      changes only by the user's own hand, after a reading, from level ground.
    verified: web-2026-10-27
    note: >
      Confirmed against the Stanford Encyclopedia of Philosophy, "Reflective
      Equilibrium" (Carl Knight, 2023): "Equilibrium is reached where principles and
      judgments have been revised such that they agree with each other." The Theory
      itself was not opened.

  COLLINGWOOD-1940-STRAIN:
    work: An Essay on Metaphysics
    locus: Ch. V, p. 48 n., the footnote on how a constellation of absolute presuppositions changes
    author: R. G. Collingwood
    date: 1940
    domain: philosophy
    supports: >
      A constellation of absolute presuppositions is under strains, taken up in
      various ways; when they are too great the structure gives way to a modification
      of itself, and not by anyone's argument. The archai root's second reading looks
      for the strain, when every dependent's exceptions strain the same way, and the
      order changes only from level ground.
    verified: unverified
    note: >
      Drawn from model knowledge. The footnote was not found in the Stanford
      Encyclopedia's entry or by search on 2026-10-27; to be read in the text before
      anything leans on its wording.

  # ---- Cueing and habit: why intentions become behaviour -------------------

  JAMES-1890-HABIT:
    work: The Principles of Psychology, Ch. 4 "Habit"
    author: William James
    date: 1890
    domain: psychology
    quote: "Never suffer an exception to occur till the new habit is securely rooted in your life"
    supports: >
      Habit as the flywheel; make the nervous system an ally. BUT the "never suffer an
      exception" maxim is the one place he is empirically wrong — see LALLY-2010.
      Kept for the physiology, not the absolutism.
    verified: unverified
    contradicted_by: [LALLY-2010]

  GOLLWITZER-1999:
    work: "Implementation intentions: Strong effects of simple plans"
    author: Gollwitzer, P. M.
    venue: American Psychologist 54(7), 493-503
    date: 1999
    domain: psychology
    peer_reviewed: true
    supports: The if-then format. Every item in this Rule is written as one.
    verified: unverified

  GOLLWITZER-SHEERAN-2006:
    work: "Implementation intentions and goal achievement: A meta-analysis of effects and processes"
    author: Gollwitzer, P. M., & Sheeran, P.
    venue: Advances in Experimental Social Psychology 38, 69-119
    date: 2006
    domain: psychology
    peer_reviewed: true
    claim: d ~ 0.65 across 94 independent studies
    verified: unverified

  LALLY-2010:
    work: "How are habits formed: Modelling habit formation in the real world"
    author: Lally, P., van Jaarsveld, C. H. M., Potts, H. W. W., & Wardle, J.
    venue: European Journal of Social Psychology 40(6), 998-1009
    date: 2010
    domain: psychology
    peer_reviewed: true
    quote: "missing one opportunity to perform the behaviour did not materially affect the habit formation process"
    claim: Median 66 days to automaticity; range 18-254 days; n=96 over 12 weeks.
    supports: >
      The direct refutation of James's ball of string, and the reason a missed day is
      logged as an event rather than a verdict. hypomnemata › deviation.
    verified: web-2026-09-21

  WOOD-NEAL-2007:
    work: "A new look at habits and the habit-goal interface"
    author: Wood, W., & Neal, D. T.
    venue: Psychological Review 114(4), 843-863
    date: 2007
    domain: psychology
    peer_reviewed: true
    supports: Habits are context-cued, not goal-driven. Change the room, not the resolve.
    verified: unverified

  WOOD-2002:
    work: "Habits in everyday life: Thought, emotion, and action"
    author: Wood, W., Quinn, J. M., & Kashy, D. A.
    venue: Journal of Personality and Social Psychology 83(6), 1281-1297
    date: 2002
    domain: psychology
    peer_reviewed: true
    claim: ~43% of daily behaviour performed almost daily, in the same context.
    verified: unverified

  LEROY-2009:
    work: "Why is it so hard to do my work? The challenge of attention residue"
    author: Leroy, S.
    venue: Organizational Behavior and Human Decision Processes 109(2), 168-181
    date: 2009
    domain: organizational-psychology
    peer_reviewed: true
    supports: Attention residue — switching costs are worst when the prior task is unfinished.
    verified: unverified

  LEROY-GLOMB-2018:
    work: "Tasks interrupted: How anticipating time pressure on resumption of an interrupted task causes attention residue and low performance on interrupting tasks, and how a 'ready-to-resume' plan mitigates the effects"
    author: Leroy, S., & Glomb, T. M.
    venue: Organization Science 29(3), 380-397
    doi: 10.1287/orsc.2017.1184
    date: 2018
    domain: organizational-psychology
    peer_reviewed: true
    supports: >
      A brief ready-to-resume plan — where you left off, what remains, what you are
      postponing — clears attention residue WITHOUT finishing the task. The evidence
      base for step 2 of the exit rite, and the answer to "just finish it first."
    verified: web-2026-09-21

  MASICAMPO-2011:
    work: "Consider it done! Plan making can eliminate the cognitive effects of unfulfilled goals"
    author: Masicampo, E. J., & Baumeister, R. F.
    venue: Journal of Personality and Social Psychology 101(4), 667-683
    date: 2011
    domain: psychology
    peer_reviewed: true
    supports: >
      Making a plan discharges an unfulfilled goal's intrusion as well as completing it
      does. Why a backlog entry must contain a cue, not just a name.
    verified: unverified

  ZEIGARNIK-1927:
    work: "Das Behalten erledigter und unerledigter Handlungen"
    author: Zeigarnik, B.
    date: 1927
    domain: psychology
    supports: Unfinished tasks intrude on memory. Why the un-advanced laundry occupies the afternoon.
    verified: unverified

  GALLA-DUCKWORTH-2015:
