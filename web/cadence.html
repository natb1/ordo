  host.appendChild(row);
}
var WORK_TIERS={follow:"Follow-ups — they ride along",meeting:"Meetings — each takes its session outright",
  due:"Periodic and TODO, by how far overdue",canon:"Canon — the frontier, then dictations",
  later:"Not now — not yet due, or it cannot start in this session"};
/* Ranked rows under their tier headings, in the heading class the card uses. */
function workRows(host,rs,cls){
  var lastStep=null;
  rs.forEach(function(r){
    if(r.step!==lastStep){ host.appendChild(el("div",cls,WORK_TIERS[r.step])); lastStep=r.step; }
    workRow(host,r);
  });
}
function workList(host,pid){
  var rs=rankWork(pid);
  if(!rs.length){ para(host,"empty","Nothing open."); return; }
  workRows(host,rs,"dsub");
}

/* ---- the project card ---- */
function openProject(pid){
  var p=projAny(pid); if(!p) return;
  /* The project as the Rule has it when the card is painted: one adopted while the
     card is open may have changed its allocation. */
  defineCard("proj:"+pid,p.what,function(host){ paintProject(host,projAny(pid)||p); });
  openCard("proj:"+pid);
}
function paintProject(host,p){
  host.textContent="";
  var fc=focusCounts(), used=fc[p.id]||0, meet=meetingCounts()[p.id]||0, alloc=allocOf(p);
  head(host,"Allocation");
  var line=el("div","thread"); line.appendChild(allocDots(used,alloc,meet));
  line.appendChild(document.createTextNode(" "+countText(used)+" of "+alloc+" this week"+(meet?" · "+plural(meet,"meeting")+" counted as used":"")));
  host.appendChild(line);
  var dr=draft("proj:"+p.id);
  var num=field(host,"Sessions this week",numInput(dr.alloc!=null?dr.alloc:alloc,0),"proj:alloc");
  num.addEventListener("input",function(){ dr.alloc=num.value; });
  if(alloc!==p.allocation) para(host,"note","This week only; the Rule says "+p.allocation+".");
  var nh=head(host,"Next step");
  var ta=document.createElement("textarea"); ta.value=(dr.next!=null)?dr.next:threadLine(p.id); ta.setAttribute("aria-labelledby",nh.id);
  ta.setAttribute("data-fk","proj:next"); ta.placeholder="Where this project picks up"; ta.addEventListener("input",function(){ dr.next=ta.value; });
  host.appendChild(ta);
  var acts=el("div","acts");
  acts.appendChild(actButton("Save","go",function(){
    var a=parseInt(dr.alloc,10);
    if(!isNaN(a) && a>=0 && a!==alloc) putProject(p.id,{allocation:a,allocWeek:sundayOf(logicalToday())});
    if(dr.next!=null && dr.next.trim()!==threadLine(p.id)) setThread(p.id,dr.next.trim());
    delete drafts["proj:"+p.id]; render();
  }));
  host.appendChild(acts);
  linksFor(host,p);
  head(host,"Work, in order");
  workList(host,p.id);
}

/* ---- the TODO card ---- */
function openTodo(pid,itemId){
  var p=projAny(pid); if(!p) return;
  var dr=draft("todo:"+pid); if(itemId) dr.open=itemId;
  defineCard("todo:"+pid,p.what+" — TODO",function(host){ paintTodo(host,p); });
  openCard("todo:"+pid);
}
function blocksChooser(host,dr,except){
  var box=el("div");
  blockables(except).forEach(function(bk){
    var b=el("button","kidrow pick"); b.type="button";
    b.setAttribute("aria-pressed",String(dr.blocks.indexOf(bk.id)>=0));
    b.innerHTML='<span class="tick">'+TICK+'</span>';
    b.appendChild(el("span","lbl",bk.label+" · "+bk.kind));
    b.addEventListener("click",function(){
      var i=dr.blocks.indexOf(bk.id);
      if(i>=0) dr.blocks.splice(i,1); else dr.blocks.push(bk.id);
      b.setAttribute("aria-pressed",String(i<0));
    });
    box.appendChild(b);
  });
  host.appendChild(box);
}
/* The last thing a card finished or removed, until the card closes: one tap puts
   it back, so neither has to be asked about first. */
function undoLine(host,dr){
  var u=dr.undo; if(!u) return;
  var row=el("div","undo"); row.setAttribute("role","status");
  row.appendChild(el("span",null,u.said));
  row.appendChild(actButton("Undo","no",function(){ u.put(u.id,u.patch); delete dr.undo; render(); }));
  host.appendChild(row);
}
function copyText(txt,btn){
  function done(ok){ var was=btn.textContent; btn.textContent=ok?"Copied":"Select and copy"; setTimeout(function(){ btn.textContent=was; },1600); }
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){ done(true); },function(){ done(false); });
  else done(false);
}
function invocation(x){ return "/principal:dictate "+(x.dictation||x.what||"").trim(); }
function paintTodo(host,p){
  host.textContent="";
  var dr=draft("todo:"+p.id);
  para(host,"prompt","Captured on sight, in your own words: a claim with a finish line. Give it a date if it has one; without one it is due "+words(TODO_CADENCE)+" days after capture. What it stops is blocked while it is open, and it stands just before it in the order. An item another tool owns shows where it came from, and its owner closes it.");
  undoLine(host,dr);
  /* adding one */
  var addBtn=actButton(dr.adding?"Cancel":"Add an item",dr.adding?"no":"go",function(){ dr.adding=!dr.adding; if(!dr.adding){ delete dr.add; } repaintCard("todo:"+p.id); if(dr.adding) focusAdded("todo:"+p.id); });
  var top=el("div","acts"); top.appendChild(addBtn); host.appendChild(top);
  if(dr.adding){
    var a=dr.add=dr.add||{blocks:[]};
    var h=field(host,"Heading",textInput(a.what,"What it is")); h.setAttribute("data-fk","add:what"); h.setAttribute("data-autofocus","");
    h.addEventListener("input",function(){ a.what=h.value; });
    var d=field(host,"Details",document.createElement("textarea"),"add:dictation"); d.value=a.dictation||""; d.placeholder="Your own prose: the details, and why";
    d.addEventListener("input",function(){ a.dictation=d.value; });
    var n=field(host,"Next step",textInput(a.next,"Where you would pick up"),"add:next"); n.addEventListener("input",function(){ a.next=n.value; });
    var by=field(host,"Due by",dateInput(a.by),"add:by"); by.addEventListener("change",function(){ a.by=by.value||null; });
    var bl=field(host,"It blocks",el("div"));
    if(dr.blocksOpen) blocksChooser(bl,a,null);
    else bl.appendChild(actButton("Name what it stops","no",function(){ dr.blocksOpen=true; repaintCard("todo:"+p.id); }));
    var acts=el("div","acts");
    acts.appendChild(actButton("Capture","go",function(){
      var what=(a.what||"").trim(); if(!what){ nudge(acts,"Name it first."); h.focus(); return; }
      var id=newId("i");
      putTodo(id,{project:p.id,what:what,dictation:(a.dictation||"").trim()||null,next:(a.next||"").trim()||null,
                   by:a.by||null,blocks:a.blocks.slice(),captured:logicalToday()});
      delete dr.add; dr.adding=false; dr.blocksOpen=false; render();
    }));
    host.appendChild(acts);
  }
  /* the items */
  var ids={}; todoFor(p.id).forEach(function(x){ ids[x.id]=true; });
  var items=rankWork(p.id).filter(function(r){ return ids[r.o.id]; });
  if(!items.length){ para(host,"empty","The TODO list is empty."); return; }
  head(host,"Open, in order");
  items.forEach(function(r){ todoItem(host,p,r.o,dr); });
}
function todoItem(host,p,x,dr){
  var open=dr.open===x.id;
  var hd=el("button","ihead"); hd.type="button"; hd.setAttribute("data-fk","item:"+x.id);
  hd.setAttribute("aria-expanded",String(open));
  var b=el("b",null,x.what); hd.appendChild(b);
  if((x.blocks||[]).length) hd.appendChild(el("span","dtag","blocks"));
  var owner=ownerOf(x);
  if(owner) hd.appendChild(el("span","dtag",owner));
  hd.addEventListener("click",function(){ dr.open=open?null:x.id; delete dr.edit; repaintCard("todo:"+p.id); });
  host.appendChild(hd);
  if(!open) return;
  /* A draft is one item's: opened onto another from a row or the Blocked card, the
     card starts that one afresh rather than saving the last one's fields onto it. */
  if(dr.edit && dr.edit.id!==x.id) delete dr.edit;
  if(owner){ ownedItem(host,p,x,dr,owner); return; }
  var e=dr.edit=dr.edit||{id:x.id,what:x.what,dictation:x.dictation||"",next:threadLine(x.id),by:x.by||"",blocks:(x.blocks||[]).slice()};
  var wrap=el("div","iopen"); host.appendChild(wrap);
  var h=field(wrap,"Heading",textInput(e.what),"ed:what:"+x.id); h.addEventListener("input",function(){ e.what=h.value; });
  var d=field(wrap,"Details",document.createElement("textarea"),"ed:dictation:"+x.id); d.value=e.dictation; d.placeholder="Your own prose: the details, and why";
  d.addEventListener("input",function(){ e.dictation=d.value; });
  var n=field(wrap,"Next step",textInput(e.next,"Where you pick up"),"ed:next:"+x.id); n.addEventListener("input",function(){ e.next=n.value; });
  var by=field(wrap,"Due by",dateInput(e.by),"ed:by:"+x.id); by.addEventListener("change",function(){ e.by=by.value; });
  var bl=field(wrap,"It blocks",el("div"));
  if(dr.blocksOpen===x.id) blocksChooser(bl,e,x.id);
  else{
    if(e.blocks.length) bl.appendChild(el("div","hist",e.blocks.map(labelOf).join(", ")));
    bl.appendChild(actButton(e.blocks.length?"Change":"Name what it stops","no",function(){ dr.blocksOpen=x.id; repaintCard("todo:"+p.id); }));
  }
  var today=logicalToday();
  /* Finishing and removing are one tap, and the card offers them back once. */
  function finish(said,patch,undo){
    dr.undo={said:said,put:putTodo,id:x.id,patch:undo};
    if(patch.done && !patch.removed) closeTodo(x.id,patch.doneAt,patch); else putTodo(x.id,patch);
    delete dr.edit; dr.open=null; render();
  }
  function donePatch(){ return {done:true,doneAt:today}; }
  if(isRepair(x)){
    wrap.appendChild(el("div","hist",repairStatus(x)));
    var sacts=el("div","acts");
    sacts.appendChild(actButton("Resolved","no",function(){ finish("Resolved: "+x.what+".",donePatch(),{done:false,doneAt:null}); }));
    if(x.escalated==="money") sacts.appendChild(actButton("Not a money problem","no",function(){ putTodo(x.id,{escalated:null}); render(); }));
    else{
      sacts.appendChild(actButton("Money","no",function(){ putTodo(x.id,{escalated:"money"}); render(); }));
      sacts.appendChild(actButton("Back to the sort","no",function(){ diagnosed(x); render(); }));
    }
    wrap.appendChild(sacts);
  }
  var acts=el("div","acts");
  acts.appendChild(actButton("Save","go",function(){
    var patch={what:(e.what||"").trim()||x.what,by:e.by||null,blocks:e.blocks.slice(),dictation:(e.dictation||"").trim()||null};
    putTodo(x.id,patch);
    var nx=(e.next||"").trim(); if(nx!==threadLine(x.id)) setThread(x.id,nx);
    delete dr.edit; dr.blocksOpen=false; render();
  }));
  acts.appendChild(actButton("Done","no",function(){ finish("Done: "+x.what+".",donePatch(),{done:false,doneAt:null}); }));
  acts.appendChild(actButton("Remove","no rm",function(){ finish("Removed: "+x.what+".",{done:true,removed:true,doneAt:today},{done:false,removed:false,doneAt:null}); }));
  wrap.appendChild(acts);
}
/* An item another tool owns (hypomnemata › undertaking): its source is one link, its
   owner closes it, and the card offers only that it is not wanted. The line to resume
   by is the page's own, here as on any item. A remove is dated, as a close is, so the
   weekly review can count it. */
function ownedItem(host,p,x,dr,owner){
  var wrap=el("div","iopen"); host.appendChild(wrap);
  var nl=threadLine(x.id), n=field(wrap,"Next step",textInput(nl,"Where you pick up"),"ed:next:"+x.id);
  if(x.dictation) wrap.appendChild(el("div","hist",x.dictation));
  wrap.appendChild(el("div","hist",x.by ? "Due by "+x.by+"." : "Undated: it waits until "+owner+" dates it."));
  var row=el("div","links"), href=webLink(x.source.url);
  if(href){ var a=el("a",null,"From "+owner); a.href=href; a.target="_blank"; a.rel="noopener"; row.appendChild(a); }
  else row.appendChild(el("span",null,"From "+owner));
  wrap.appendChild(row);
  para(wrap,"prompt",owner+" closes it when what it tracks is done. If you do not want it, say so here.");
  var acts=el("div","acts");
  acts.appendChild(actButton("Save","go",function(){
    var nx=(n.value||"").trim(); if(nx!==nl) setThread(x.id,nx); dr.open=null; render();
  }));
  acts.appendChild(actButton("Not wanted","no rm",function(){
    dr.undo={said:"Not wanted: "+x.what+".",put:putTodo,id:x.id,patch:{done:false,removed:false,doneAt:null}};
    putTodo(x.id,{done:true,removed:true,doneAt:logicalToday()}); dr.open=null; render();
  }));
  wrap.appendChild(acts);
}

/* ---- the dictations card ----
   A dictation is a quick note bound for the project's notebook, kept here until it
   is dictated (hypomnemata › kinds). Its work is to be run through the notebook's
   dictate entry point with the note as the input; once that has run the note is let
   go, and what it became is read off the notebook, not told here. */
function openDictations(pid){
  var p=projAny(pid); if(!p) return;
  defineCard("dict:"+pid,p.what+" — dictations",function(host){ paintDictations(host,p); });
  openCard("dict:"+pid);
}
function paintDictations(host,p){
  host.textContent="";
  var dr=draft("dict:"+p.id);
  para(host,"prompt","A thought bound for the notebook, in your own words. Copy the invocation, run it in a Claude Code session in the "+
    String(p.checkout||p.repo||p.what).replace(/^https:\/\/github\.com\//,"")+" checkout, and let the note go once it has run.");
  undoLine(host,dr);
  var ta=document.createElement("textarea"); ta.value=dr.text||""; ta.placeholder="The note, as you would say it";
  ta.setAttribute("data-fk","dict:text"); ta.setAttribute("aria-label","A new dictation");
  ta.addEventListener("input",function(){ dr.text=ta.value; });
  host.appendChild(ta);
  var top=el("div","acts");
  top.appendChild(actButton("Capture","go",function(){
    var t=(dr.text||"").trim(); if(!t){ nudge(top,"Say it first."); ta.focus(); return; }
    putTodo(newId("d"),{project:p.id,kind:"dictation",dictation:t,what:t.split("\n")[0].slice(0,80),captured:logicalToday()});
    delete dr.text; render();
  }));
  host.appendChild(top);
  linksFor(host,{notebook:p.notebook});
  function letGo(x,said){
    dr.undo={said:said,put:putTodo,id:x.id,patch:{done:false,removed:false}};
    putTodo(x.id,{done:true,removed:true}); render();
  }
  var ds=dictationsFor(p.id).sort(function(a,b){ return String(a.captured||"").localeCompare(String(b.captured||"")); });
  if(!ds.length) para(host,"empty","No dictation waiting.");
  else head(host,"Waiting to be dictated, oldest first");
  ds.forEach(function(x){
    var row=el("div","dkid");
    row.appendChild(el("b",null,x.what||String(x.dictation||"").slice(0,80)));
    row.appendChild(el("span","dwhy","Captured "+String(x.captured||"").slice(0,10)+"."));
    row.appendChild(el("div","inv",invocation(x)));
    var acts=el("div","acts");
    var cp=actButton("Copy the invocation","go",function(){ copyText(invocation(x),cp); }); acts.appendChild(cp);
    acts.appendChild(actButton("It has run — let it go","no",function(){ letGo(x,"Let go: "+(x.what||"the note")+"."); }));
    row.appendChild(acts);
    host.appendChild(row);
  });
  /* What an older page recorded under a question's reference was dictated already. */
  var old=dictatedFor(p.id);
  if(old.length) head(host,"Dictated already");
  old.forEach(function(x){
    var row=el("div","dkid");
    row.appendChild(el("b",null,x.what||x.canon));
    row.appendChild(el("span","dwhy","Recorded as "+x.canon+(x.recordedAt?" on "+x.recordedAt:"")+"; what it became is read off the notebook."));
    var acts=el("div","acts");
    acts.appendChild(actButton("Let it go","no",function(){ letGo(x,"Let go: "+(x.what||x.canon)+"."); }));
    row.appendChild(acts);
    host.appendChild(row);
  });
}

/* ---- the periodic card ---- */
function openPeriodic(pid){
  var p=projAny(pid); if(!p) return;
  defineCard("periodic:"+pid,p.what+" — periodic",function(host){ paintPeriodic(host,p); });
  openCard("periodic:"+pid);
}
function paintPeriodic(host,p){
  host.textContent="";
  var dr=draft("periodic:"+p.id);
  para(host,"prompt","Work that recurs on a cadence and competes for a slot. It gets more urgent as it ages; a missed one lands the next day, not the next week.");
  undoLine(host,dr);
  var addBtn=actButton(dr.adding?"Cancel":"Add an item",dr.adding?"no":"go",function(){ dr.adding=!dr.adding; if(!dr.adding) delete dr.add; repaintCard("periodic:"+p.id); if(dr.adding) focusAdded("periodic:"+p.id); });
  var top=el("div","acts"); top.appendChild(addBtn); host.appendChild(top);
  if(dr.adding){
    var a=dr.add=dr.add||{};
    var h=field(host,"Heading",textInput(a.what,"What it is"),"padd:what"); h.setAttribute("data-autofocus","");
    h.addEventListener("input",function(){ a.what=h.value; });
    var c=field(host,"Every … days",numInput(a.cadence,1),"padd:cadence"); c.addEventListener("input",function(){ a.cadence=c.value; });
    var d=field(host,"Next due",dateInput(a.due),"padd:due"); d.addEventListener("change",function(){ a.due=d.value; });
    var acts=el("div","acts");
    acts.appendChild(actButton("Add","go",function(){
      var what=(a.what||"").trim(), cad=parseInt(a.cadence,10);
      if(!what || !(cad>0)) return;
      putPeriodic(newId("p"),{project:p.id,what:what,cadence:cad,due:a.due||null,history:[],outranks:false});
      delete dr.add; dr.adding=false; render();
    }));
    host.appendChild(acts);
  }
  var items=periodicFor(p.id);
  if(!items.length){ para(host,"empty","No periodic items."); return; }
  head(host,"Items");
  items.forEach(function(x){ periodicItem(host,p,x,dr); });
}
function periodicItem(host,p,x,dr){
  var open=dr.open===x.id, st=periodicStatus(x), bb=blockedBy(x,viewDate);
  var hd=el("button","ihead"); hd.type="button"; hd.setAttribute("data-fk","item:"+x.id);
  hd.setAttribute("aria-expanded",String(open));
  hd.appendChild(el("b",null,x.what));
  /* Blocked is not overdue (the TODO policy › policy.fields.blocks): it waits behind its repair. */
  hd.appendChild(el("span","pcount", bb ? "blocked" : st.due ? (st.over ? "overdue "+st.over+"d" : "due") : "due "+st.on));
  hd.addEventListener("click",function(){ dr.open=open?null:x.id; delete dr.edit; repaintCard("periodic:"+p.id); });
  host.appendChild(hd);
  if(!open) return;
  /* The date opens on the computed due date; due0 remembers it, so only a date
     changed here becomes one set on the card. */
  var e=dr.edit=dr.edit||{what:x.what,cadence:x.cadence,due:st.on||"",due0:st.on||""};
  var wrap=el("div","iopen"); host.appendChild(wrap);
  var h=field(wrap,"Heading",textInput(e.what),"ped:what:"+x.id); h.addEventListener("input",function(){ e.what=h.value; });
  var c=field(wrap,"Every … days",numInput(e.cadence,1),"ped:cadence:"+x.id); c.addEventListener("input",function(){ e.cadence=c.value; });
  var d=field(wrap,"Next due",dateInput(e.due),"ped:due:"+x.id); d.addEventListener("change",function(){ e.due=d.value; });
  if(x.outranks) para(wrap,"note","Marked to outrank any project once overdue.");
  head(wrap,"Done");
  var hist=(x.history||[]).slice();
  [x.tracks,x.id].forEach(function(k){ if(!k) return; var t=lastDoneDate(k); if(t && hist.indexOf(t)<0) hist.push(t); });
  if(x.last && hist.indexOf(x.last)<0) hist.push(x.last);
  hist.sort().reverse();
  wrap.appendChild(el("div","hist",hist.length ? hist.join(" · ") : "No record yet."));
  var acts=el("div","acts");
  acts.appendChild(actButton("Done today","go",function(){
    var hs=(x.history||[]).slice(), today=logicalToday(); if(hs.indexOf(today)<0) hs.push(today);
    /* The doing restarts the cadence, so a date set on the card is spent. One with
       a follow-up is also started, in the session it went in — unless a bell
       already recorded it today, which said so itself. */
    var patch={history:hs,due:null};
    if(x.then && lastDoneDate(x.id)!==today) patch.started=sessionNow();
    putPeriodic(x.id,patch); delete dr.edit; render();
  }));
  acts.appendChild(actButton("Save","no",function(){
    var cad=parseInt(e.cadence,10);
    var patch={what:(e.what||"").trim()||x.what,cadence:cad>0?cad:x.cadence};
    if(e.due!==e.due0) patch.due=e.due||null;
    putPeriodic(x.id,patch);
    delete dr.edit; render();
  }));
  acts.appendChild(actButton("Remove","no rm",function(){
    dr.undo={said:"Removed: "+x.what+".",put:putPeriodic,id:x.id,patch:{removed:false}};
    putPeriodic(x.id,{removed:true}); delete dr.edit; dr.open=null; render();
  }));
  wrap.appendChild(acts);
}

/* ===== render ===== */
/* The day and the nav are rebuilt on every change, so a row ticked from the keyboard
   would otherwise leave focus on nothing. Each control carries a data-fk to be found
   again by. */
function render(){
  if(!ruleSeen){
    var none=document.getElementById("blocks"); none.textContent="";
    para(none,"note","The Rule has not reached this browser yet. It arrives from the page's store the first time the page is opened online.");
    return;
  }
  renderToolbar();
  renderFixtures();
  var day=document.getElementById("v-today"), nav=document.getElementById("navList");
  var mDay=focusMark(day), mNav=focusMark(nav);
  renderNav();
  var host=document.getElementById("blocks"); host.textContent="";
  var cur=currentBlockKey();
  var dayLabel=parseYmd(viewDate).toLocaleDateString(undefined,
    {weekday:"short",month:"short",day:"numeric"});
  blocksFor(viewDate).forEach(function(b){
    var sec=el("section","blk"+(isToday()&&b.key===cur?" now":""));
    sec.id="b-"+b.key;
    var hd=el("div","blkhd");
    hd.appendChild(el("b",null,b.name));
    hd.appendChild(el("span","blkdate",dayLabel));
    hd.appendChild(el("i",null,fmt(b.at)));
    sec.appendChild(hd);
    sec.appendChild(bellBox(b));
    meetingLines(b).forEach(function(w){ sec.appendChild(el("div","meetline",w)); });
    var ul=el("ul","items");
    b.items.forEach(function(it){ addRow(ul,it); });
    sec.appendChild(ul);
    host.appendChild(sec);
  });
  focusRestore(day,mDay); focusRestore(nav,mNav);
  syncTail();
  if(view==="week") renderWeek();
  if(view==="docket") renderDocket();
  refreshCards();
}
/* The first drawing, and one after a Rule that would not draw. What this browser
   keeps (the Rule, the TODO list) can be something this page cannot draw, and what
   mends it comes from the store: so a failure is said, and the page goes on to reach
   the store, where it would otherwise stop short of it on every load. */
function drawOrSay(){
  try{ render(); }
  catch(e){
    if(window.console) console.error("cadence: the page could not be drawn from what this browser keeps",e);
    var host=document.getElementById("blocks");
    if(host){
      host.textContent="";
      para(host,"note","The page could not be drawn from what this browser keeps. It draws again when the store sends what mends it; if it stays like this, run /ordo.");
    }
  }
}
/* A meeting takes the work session it falls in, and its block says so: which
   meeting, when, and whose session it spends. */
function meetingLines(b){
  var out=[];
  b.items.forEach(function(it){
    var c=it.focus && meetingIn(it.id,viewDate,true);
    if(!c) return;
    if(cancelledOn(c.id,viewDate)) out.push("Meeting — "+c.what+" did not happen: an ordinary session.");
    else out.push("Meeting — "+c.what+", "+fmt(hm(c.start))+(c.end?" to "+fmt(hm(c.end)):"")+
                  ". It takes this session"+(c.project?" for "+projName(c.project):"")+".");
  });
  return out;
}
/* The minute's worth of render: which block is now, and a bell whose warning has
   just rung, without rebuilding anything else — but the cards that are about the
   clock: the focus cards, once the block changes, and an open bell's card, once
   its bell rings. */
var markedBlock=null;
function markNow(){
  var cur=isToday()?currentBlockKey():null;
  if(cur!==markedBlock){
    markedBlock=cur;
    Object.keys(cards).forEach(function(id){
      if((id==="focus" || id.indexOf("row:focus_")===0) && shell.isOpen(id)) repaintCard(id); });
  }
  Array.prototype.forEach.call(document.querySelectorAll("#blocks section.blk"),function(sec){
    sec.classList.toggle("now",sec.id==="b-"+cur);
  });
  blocksFor(viewDate).forEach(function(b){
    var box=document.querySelector("#b-"+b.key+" > .bellbox");
    if(box && box.getAttribute("data-st")!==bellState(b)){
      box.parentNode.replaceChild(bellBox(b),box);
      if(shell.isOpen("bell:"+b.key)) repaintCard("bell:"+b.key);
    }
  });
  Array.prototype.forEach.call(document.querySelectorAll("#navBlocks button"),function(btn){
    btn.classList.toggle("isnow",btn.getAttribute("data-fk")==="nav:"+cur);
  });
}
/* The last block cannot scroll to the top unless something follows it. Give the
   day exactly enough tail that every block can, and no more — a fixed pad is
   either short on a tall block or a chasm on a short one. */
function syncTail(){
  var tail=document.getElementById("tail"), last=document.getElementById("blocks").lastElementChild;
  if(!tail) return;
  tail.style.height="0px";
  if(!last || view!=="today") return;
  var sc=shell.scroller();
  var top=last.getBoundingClientRect().top-sc.getBoundingClientRect().top+sc.scrollTop;
  var margin=parseFloat(getComputedStyle(last).scrollMarginTop)||0;
  var need=top-margin+sc.clientHeight-sc.scrollHeight;
  tail.style.height=Math.max(0,Math.ceil(need))+"px";
}

function bellBox(b){
  var rec=(state.bells||{})[b.key], box=el("div","bellbox"+(rec?" answered":""));
  var main=el("div","bellmain"), st=bellState(b), dx=!rec && bellNotExpected(b.key,state.date);
  box.setAttribute("data-st",st);
  if(rec){
    main.appendChild(el("div","when",answeredText(rec)));
  } else if(dx){
    /* Not expected: nothing to answer, though the card still takes an answer. */
    main.appendChild(el("div","when",notExpectedText(dx)));
  } else if(st==="early" || st==="future"){
    /* Only a bell that has rung carries the big button. One still to come is a line,
       and its card — through the context button — answers it early on purpose. */
    main.appendChild(el("div","when yet","Rings at "+fmt(b.at)));
  } else {
    var btn=el("button","answer",st==="past"?"Record this bell":"Answer the bell");
    btn.type="button"; btn.setAttribute("data-fk","bell:"+b.key); btn.setAttribute("data-fk-then","bellctx:"+b.key);
    btn.addEventListener("click",function(){ openBell(b); });
    main.appendChild(btn);
  }
  box.appendChild(main);
  /* The context button is the edit button. There is no second one: an answered bell
     and an unanswered bell take the same inputs, so they take the same card. */
  box.appendChild(ctxButton((rec?"Edit ":"Answer ")+b.name,function(){ openBell(b); },"bellctx:"+b.key));
  return box;
}
/* A bell card belongs to the day it was opened on: its bell time, what it closes
   and its draft are all that day's. Changing the day closes it (see setViewDate).
   The block is looked up each time the card is painted: a Rule adopted while the
   card is open may have moved its bell, and an answer is measured against the bell. */
function openBell(b){
  var id="bell:"+b.key, key=b.key;
  defineCard(id,b.name+" — "+fmt(b.at),function(host){
    var cur=b;
    blocksFor(viewDate).forEach(function(x){ if(x.key===key) cur=x; });
    if(cur!==b) shell.setTitle(id,cur.name+" — "+fmt(cur.at));
    paintBell(host,cur);
  });
  /* Focus goes to the card, not its first field: the first act is choosing, and a
     field would put the phone's keyboard up over the list. */
  if(shell.isOpen(id)) paintCard(id);
  shell.open(id);
  var body=shell.body(id);
  if(body) body.focus();
}

function addRow(ul,it){
  var li=el("li"), b=blockedBy(it,state.date);
  if(b) li.className="is-blocked";
  var gs=groupState(it), isGroup=!!(it.children&&it.children.length);
  var btn=el("button","row");
  btn.type="button"; btn.setAttribute("data-fk","row:"+it.id);
  btn.setAttribute("aria-pressed", gs.all?"true":"false");
  btn.innerHTML='<span class="tick">'+TICK+'</span><span class="what2"></span>';
  var w=btn.querySelector(".what2");
  w.appendChild(el("b",null,it.do));
  var sub = b ? blockedLine(b,it) : it.sub;
  var bparts=b ? [] : leaves(it).filter(function(k){ return k!==it && blockedBy(k,state.date); });
  if(bparts.length) sub=bparts.map(function(k){ return k.do; }).join(", ")+" blocked — "+blockedBy(bparts[0],state.date).what+". Not missed.";
  if(it.focus){
    var f=(state.focus||{})[it.id];
    var nm=f ? (f.projects||[]).concat(f.undertakings||[]).map(projName) : [];
    if(nm.length) sub=nm.join(" · ");
    else if(f && f.planned) sub="Planned — "+projName(f.planned);
  }
  if(it.value && typeof state.weight==="number") sub=state.weight+" "+it.value;
  if(it.floor && !b){
    var fc=floorCount(it,state.date);
    sub=(sub?sub+" · ":"")+fc+" of "+it.floor+" this week";
    if(fc>=it.floor && !gs.all) li.classList.add("na");
  }
  var naVal=(state.na||{})[it.id], dx=!b && !gs.done && notExpectedOn(it,state.date);
  if(naVal){
    li.classList.add("na");
    sub = notNeededText(naVal);
  } else if(dx){
    li.classList.add("na");
    sub = notExpectedText(dx);
  }
  if(sub) w.appendChild(el("span",null,sub));
  if(b) btn.appendChild(el("span","flag","Blocked"));
  if(isGroup&&!b){
    btn.appendChild(el("span","at",gs.done+"/"+gs.total));
    if(gs.some) btn.querySelector(".tick").classList.add("some");
  }

  /* A blocked row does not tick: its repair is in the work order. */
  if(!b) btn.addEventListener("click",function(){
    /* Items that take input do not toggle from the row at all — the card is the
       only place the value can be given, so the row opens it. A focus slot is the
       same: tapped at the start of a session to see what it is for, it is not done
       then. Its closing bell ticks it. */
    if(it.examen||it.value||it.focus){ openRow(it); return; }
    /* A declared "not needed" carries its reason: taking it back is the card's
       Undo, where the reason is on screen, not a stray tap on the row. */
    if(naVal){ openRow(it); return; }
    var on=!groupState(it).all;
    markDone(it,on);
    save(); render();
    /* A tick asks nothing more. The items that need input — a focus pick, the
       weigh-in, the Examen — never toggle from the row; the row opens their card
       instead. A group's tick marks every step, so its card has nothing to ask;
       the context button still opens it. */
  });
  li.appendChild(btn);
  li.appendChild(ctxButton("Context for "+it.do,function(){ openRow(it); },"ctx:"+it.id));
  ul.appendChild(li);
}
function openRow(it){
  if(it.examen) exIdx=0;
  var id=it.id;
  /* The item as the Rule has it when the card is painted, not as it was when the card
     was opened. */
  defineCard(rowId(it),it.do,function(host){
    var cur=it;
    blocksFor(viewDate).forEach(function(b){ b.items.forEach(function(x){ if(x.id===id) cur=x; }); });
    paintRow(host,cur);
  });
  openCard(rowId(it));
}

function renderToolbar(){
  var d=parseYmd(viewDate);
  document.getElementById("datePick").value=viewDate;

  var bs=blocksFor(viewDate), cur=currentBlockKey(), curB=null;
  bs.forEach(function(b){ if(b.key===cur) curB=b; });

  /* A meeting under way is what you are doing while it lasts, whatever the block
     still owes; so is an item that carries a fixture's hours. Otherwise: the first
     thing in the block still owed. An optional item is not owed, a floor item not on
     a day the week can spare, one a whole-day fixture does not keep not at all. */
  var next=null, now=nowMins();
  commitmentsFor(DAYS[d.getDay()],viewDate).forEach(function(c){
    if(!next && c.meeting && !cancelledOn(c.id,viewDate) && c.end && hm(c.start)<=now && now<hm(c.end)) next={do:c.what};
  });
  bs.forEach(function(b){ b.items.forEach(function(it){
    if(!next && it.window && it.window[0] && it.window[1] && hm(it.window[0])<=now && now<hm(it.window[1]) &&
       !state.items[it.id] && !blockedBy(it,viewDate) && !(state.na||{})[it.id] && !notExpectedOn(it,viewDate)) next=it;
  }); });
  if(curB && !next) for(var i=0;i<curB.items.length;i++){
    var it=curB.items[i];
    if(blockedBy(it,viewDate)||(state.na||{})[it.id]||notExpectedOn(it,viewDate)) continue;
    if(it.optional || (it.floor && floorCanWait(it,viewDate))) continue;
    var ks=openLeaves(it), miss=null;
    for(var j=0;j<ks.length;j++) if(!state.items[ks[j].id]){ miss=ks[j]; break; }
    if(miss){ next = (miss===it) ? it : {do: it.do+" — "+miss.do}; break; }
  }
  /* A session under way says what it was planned for. */
  var plan=next && next.focus ? ((state.focus||{})[next.id]||{}).planned : null;
  if(plan) next={do:next.do+" — "+projName(plan)};
  /* On another day the block the clock is in is not this day's, so it is not shown;
     the day's own name is, and the way back. */
  var bl=document.getElementById("nowBlock");
  bl.hidden=!isToday();
  bl.textContent=curB?curB.name:"";
  bl.href="#b-"+cur;
  bl.onclick=function(e){ e.preventDefault(); scrollToBlock(cur,true); };

  var doing=document.getElementById("nowDoing");
  if(!isToday()){ doing.textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"}); doing.className="tbDoing done"; }
  else if(next){ doing.textContent=next.do; doing.className="tbDoing"; }
  else { doing.textContent="This block is done."; doing.className="tbDoing done"; }

  /* hypomnemata › bell, the Rule › meta.clock (show_countdown: on_demand):
     time-to-bell is on demand and never ambient, because a countdown reinstates
     the vigilance the bell exists to remove. So the line is the bell's time, which
     the minute's repaint leaves alone; how long until it is shown when the line is
     tapped, once, and never ticks. */
  var nx=document.getElementById("nowNext");
  nx.hidden=!isToday();
  if(isToday()){
    var nb=nextBell();
    nx.textContent = nb ? ("next bell "+fmt(nb.at)) : "last block";
    if(nb && asked && asked.at===nb.at && Date.now()<asked.until) nx.textContent=asked.text;
  } else nx.textContent="";
  document.getElementById("backToday").hidden=isToday();

}
function gap(m){ if(m<60) return m+" min"; var h=Math.floor(m/60),r=m%60; return h+"h"+(r?" "+r+"m":""); }
/* Asked for: the answer as it stood when asked, held for a few seconds through any
   repaint, then gone. */
var asked=null, askTimer=null;
function askNextBell(){
  var nb=isToday()?nextBell():null;
  if(!nb) return;
  asked={at:nb.at, text:"next bell "+fmt(nb.at)+" · in "+gap(nb.at-nowMins()), until:Date.now()+8000};
  renderToolbar();
  clearTimeout(askTimer); askTimer=setTimeout(function(){ asked=null; renderToolbar(); },8000);
}

/* A fixture is three things in turn, and the notice says which: ahead of you, past
   the moment you should have left, and then under way. It is not news once it has
   ended, so that is when it goes.

   The notice lives in the content footer rather than the toolbar. The toolbar is
   where you are; a departure is what you have to DO, it has to survive scrolling
   the whole day, and the bottom edge is the half of a phone a thumb reaches. */
function fixtureNote(c){
  var now=nowMins(), start=hm(c.start), end=c.end?hm(c.end):start;
  if(now>=end) return null;
  if(now>=start) return {text:c.what+" until "+fmt(end), late:true};
  return {text:(c.leaveBy ? "Leave by "+fmt(hm(c.leaveBy))+" — " : "")+
               c.what+" at "+fmt(start)+(c.varies ? " — where: see the calendar" : ""),
          late:!!(c.leaveBy && now>=hm(c.leaveBy))};
}
/* Always today's, whichever day is on screen: a departure does not wait for the page
   to be brought back to today. */
function renderFixtures(){
  /* Emptying the footer is how it is hidden — the shell gives an empty one no room. */
  var host=shell.footer(); host.textContent="";
  var t=logicalToday(), d=parseYmd(t);
  commitmentsFor(DAYS[d.getDay()],t).forEach(function(c){
    if(c.meeting && cancelledOn(c.id,t)) return;
    var n=fixtureNote(c); if(!n) return;
    var a=el("a","leave"+(n.late?" late":""),n.text);
    /* A meeting at the desk has nowhere to go, so no link; a fixture whose place
       varies has no one route: the calendar has this week's. */
    var href=c.varies ? "https://calendar.google.com/calendar/r/day/"+t.replace(/-/g,"/") : c.directions;
    if(webLink(href)){ a.href=href; a.target="_blank"; a.rel="noopener"; }
    host.appendChild(a);
  });
  var stale=syncNote(t);
  if(stale) host.appendChild(el("a","leave late",stale));
}
/* The page is a copy of the calendar, and Lauds' sync item is when it was last made
   one: its tick, with the time on its row, is the stamp. So a day worked without it
   is a day planned from yesterday's copy, and that is said here, where it cannot
   scroll away, from the moment work starts: focus 1 planned or ticked, or the
   morning block over. Before that the item is simply the next thing owed, and the
   toolbar already says so. Not needed, blocked or not expected, it is not owed. */
function syncNote(t){
  var it=null, first=null, blocks=blocksFor(t);
  blocks.forEach(function(b,i){ b.items.forEach(function(x){
    if(x.id==="sync"){ it=x; first=blocks[i+1]||null; }
  }); });
  if(!it) return null;
  var rec=loadDay(t)||blank(t);
  if((rec.items||{})[it.id] || (rec.na||{})[it.id] || blockedBy(it,t) || notExpectedOn(it,t)) return null;
  var f=(rec.focus||{}).focus_1||{};
  var working=!!f.planned || !!(rec.items||{}).focus_1 || (first && nowMins()>=first.at);
  return working ? "Not synced today — run /ordo" : null;
}

function renderNav(){
  Array.prototype.forEach.call(document.querySelectorAll("#navList [data-view]"),function(b){
    b.setAttribute("aria-current", b.dataset.view===view ? "true":"false");
  });
  var host=document.getElementById("navBlocks"); host.textContent="";
  var cur=currentBlockKey();
  blocksFor(viewDate).forEach(function(b){
    var btn=el("button",(isToday()&&b.key===cur)?"isnow":null);
    btn.type="button"; btn.setAttribute("data-fk","nav:"+b.key);
    btn.appendChild(document.createTextNode(b.name));
    btn.appendChild(el("i",null,fmt(b.at)));
    btn.addEventListener("click",function(){ scrollToBlock(b.key,true); });
    host.appendChild(btn);
  });
}
function setView(v){
  view=v;
  document.getElementById("v-today").hidden=v!=="today";
  document.getElementById("v-week").hidden=v!=="week";
  document.getElementById("v-docket").hidden=v!=="docket";
  if(v==="week") renderWeek();
  if(v==="docket") renderDocket();
  renderNav();
  syncTail();
}
/* Every way of going to a block goes through here, so every one of them lands on
   the Day view — the blocks are not on screen anywhere else. */
function scrollToBlock(key,smooth){
  if(view!=="today") setView("today");
  var e=document.getElementById("b-"+key);
  if(e) e.scrollIntoView({behavior:smooth?"smooth":"auto",block:"start"});
}
/* Today opens on the block you are in; any other day on its first. */
function positionFor(smooth){
  if(!ruleSeen) return;
  scrollToBlock(isToday()?currentBlockKey():blocksFor(viewDate)[0].key,smooth);
}
/* the Rule's ledger › drink (RATION). A drink is recorded on the day it was drunk — the
   budget card and the +1 act on the day on screen, so a late entry goes on its own
   day, and the week it is counted against is that day's week. Over or under, the
   card reads the same way: the number and nothing else (over_ration_response). */
function rationText(){
  var wk=sundayOf(viewDate), left=RATION.week-weekDrinks(viewDate),
      n=drinksOf(state)||0, dl=RATION.day-n;
  return "<b>"+left+"</b> of "+RATION.week+" left "+
         (wk===sundayOf(logicalToday())?"this week":"the week of "+wk)+
         " · <b>"+dl+"</b> of "+RATION.day+" left "+(isToday()?"today":"on "+viewDate);
}
function paintBudget(host){
  host.textContent="";
  para(host,"prompt",cap(words(RATION.day))+" a day, "+words(RATION.week)+" a week. Counted, not scored — the count is the whole of it.");
  var r=el("div","ration"), nspan=el("span","n");
  nspan.innerHTML=rationText();
  var b=el("button",null,"+1 poured"), dr=draft("budget");
  b.type="button";
  /* A tap can be taken back, but only while the card that took it is open: a
     mis-tap is corrected on the spot, and a drink poured an hour ago is not
     renegotiated from here. The draft goes when the card closes or the day changes. */
  var u=el("button",null,"Undo +1");
  u.type="button"; u.hidden=!(dr.poured>0);
  b.addEventListener("click",function(){
    pourDrinks(1);
    dr.poured=(dr.poured||0)+1;
    /* Only the number is rewritten. Repainting the card would take the focus off
       the button that was just pressed. */
    nspan.innerHTML=rationText(); u.hidden=false;
  });
  u.addEventListener("click",function(){
    if(!(dr.poured>0)) return;
    pourDrinks(-1);
    dr.poured--;
    nspan.innerHTML=rationText();
    if(!(dr.poured>0)){ u.hidden=true; b.focus(); }
  });
  r.appendChild(nspan); r.appendChild(b); r.appendChild(u); host.appendChild(r);
}

/* ===== week ===== */
function allLater(rec){
  var bs=rec.bells||{};
  return Object.keys(bs).every(function(k){ return !bs[k] || bs[k].backfilled; });
}
function renderWeek(){
  var grid=document.getElementById("grid"); grid.textContent="";
  var t0=parseYmd(logicalToday());
  var cols=[]; for(var i=6;i>=0;i--){var d=new Date(t0); d.setDate(d.getDate()-i); cols.push(d);}
  grid.appendChild(document.createElement("div"));
  cols.forEach(function(d){var h=el("div","hd",DAYS[d.getDay()].charAt(0).toUpperCase());
    grid.appendChild(h);});
  var counts={};
  BLOCKS.forEach(function(b){
    grid.appendChild(el("div","lbl",b.name));
    counts[b.key]=0;
    cols.forEach(function(d){
      var rec=loadDay(ymd(d)), dot=el("div","dot");
      /* A backfilled day holds only what was told afterwards (a pour, a tick, a
         bell recorded later): whether its other bells were answered is not known.
         One with a bell answered on the day is a day that was kept, and a bell it
         lacks was missed. */
      if(rec && (rec.bells||{})[b.key]){ dot.classList.add("on"); counts[b.key]++; }
      else if(bellNotExpected(b.key,ymd(d))) dot.classList.add("away");
      else if(!rec || (rec.backfilled && allLater(rec))){ if(d<=t0) dot.classList.add("na"); }
      grid.appendChild(dot);
    });
  });
  /* Two windows, each under its own heading. The bells are counted over the seven
     days the grid shows, and so are the days a whole-day fixture covered. Sessions
     against an allocation and drinks against the ration are weekly budgets, and the
     week starts Sunday (the Rule's ledger › week_starts), so those count from Sunday — as
     "N of M", which cannot be read as days out of seven. */
  function chips(id,rows){
    var c=document.getElementById(id); c.textContent="";
    rows.forEach(function(p){var s=el("span","chip");
      s.appendChild(document.createTextNode(p[0]+" ")); s.appendChild(el("b",null,p[1])); c.appendChild(s);});
  }
  var fc=focusCounts(), brows=BLOCKS.map(function(b){return [b.name,counts[b.key]+"/7"];});
  var nd=cols.filter(function(d){ return wholeDayFor(ymd(d)); }).length;
  if(nd) brows.push(["Not expected",nd+(nd===1?" day":" days")]);
  chips("counts",brows);
  chips("wcounts",PROJECTS.map(function(p){return [p.what,countText(fc[p.id]||0)+" of "+allocOf(p)];})
    .concat([["Drinks",weekDrinks()+" of "+RATION.week]]));
  /* The weights, as they were taken. No arrow, no difference, no colour — a day's
     number moves two pounds on water and a verdict on that is noise. */
  var ws=[];
  cols.forEach(function(d){
    var rec=loadDay(ymd(d));
    if(rec && typeof rec.weight==="number")
      ws.push(DAYS[d.getDay()].charAt(0).toUpperCase()+DAYS[d.getDay()].slice(1,3)+" "+rec.weight);
  });
  document.getElementById("wline").textContent =
    ws.length ? "Weight — "+ws.join(" · ")+" lb" : "No weight recorded in the last seven days.";
  paintBlocked(document.getElementById("breaks"));
}

/* ===== docket =====
   The projects and their work as one list: every project with its allocation used
   and total shown rather than said, its work items in order, and four
   context buttons — the project, its TODO list, its dictations, its periodic items. The backlog sits
   closed at the foot: it is reviewed monthly, and a list of what you are not doing,
   open every day, is the reminder the backlog exists to prevent. */
function nextLine(host,id,quiet){
  var c=carried(id);
  if(!c){ if(!quiet) host.appendChild(el("div","next none","No next step recorded.")); return; }
  var d=el("div","next");
  d.appendChild(document.createTextNode(c.line));
  var on=c.at ? new Date(c.at) : null;
  if(on && !isNaN(on)) d.appendChild(el("i",null,on.toLocaleDateString(undefined,{month:"short",day:"numeric"})));
  host.appendChild(d);
}
function docketProject(host,p,ranked){
  var c=el("div","dproj");
  var h=el("div","dhead");
  h.appendChild(el("b",null,p.what));
  if(ranked){
    var fc=focusCounts(), meet=meetingCounts()[p.id]||0;
    h.appendChild(allocDots(fc[p.id]||0,allocOf(p),meet));
  } else h.appendChild(el("span","pcount","Inactive"));
  var ic=el("div","dicons");
  function ib(kind,label,fn){ var b=el("button","ctxBtn"); b.type="button"; b.innerHTML=ICO[kind]; b.setAttribute("aria-label",label); b.setAttribute("data-fk",kind+":"+p.id); b.addEventListener("click",fn); ic.appendChild(b); }
  ib("proj","Project — "+p.what,function(){ openProject(p.id); });
  ib("todo","TODO — "+p.what,function(){ openTodo(p.id,null); });
  if(p.notebook || dictationDocs(p.id).length) ib("dictation","Dictations — "+p.what,function(){ openDictations(p.id); });
  ib("periodic","Periodic — "+p.what,function(){ openPeriodic(p.id); });
  h.appendChild(ic);
  c.appendChild(h);
  nextLine(c,p.id);
  var rs=rankWork(p.id);
  if(rs.length) c.appendChild(el("div","dsub","Work, in order"));
  workRows(c,rs,"dtier");
  host.appendChild(c);
}
function renderDocket(){
  var host=document.getElementById("docket"); host.textContent="";
  var on=PROJECTS.filter(function(p){ return allocOf(p)>0; });
  var off=PROJECTS.filter(function(p){ return !(allocOf(p)>0); });
  host.appendChild(el("h2",null,"Allocated"));
  on.forEach(function(p){ docketProject(host,p,true); });
  if(off.length || SHELVED.length){
    host.appendChild(el("h2",null,"Unallocated"));
    off.forEach(function(p){ docketProject(host,p,true); });
    SHELVED.forEach(function(p){ docketProject(host,p,false); });
  }
  var bl=document.getElementById("backlogList"); bl.textContent="";
  document.querySelector("#backlog summary").textContent="Backlog · "+BACKLOG.length;
  BACKLOG.forEach(function(b){
    var r=el("div","dkid");
    var h=el("b",null,b.what);
    if(b.status!=="parked") h.appendChild(el("span","dtag",b.status));
    r.appendChild(h);
    var bits=[b.slot,b.cost].filter(Boolean);
    if(bits.length) r.appendChild(el("span","dnote",bits.join(" · ")));
    bl.appendChild(r);
  });
}

/* ===== boot ===== */
viewDate=logicalToday();
adopt(viewOf(loadLocal(viewDate)||{},viewDate));
/* The TODO list's collection was `inbox` until 2026-10-14. A device's copy under the
   old name is taken as the new one's, and a write still queued for the old collection
   goes to the new; the once-per-device migration (follow) then carries what this
   device holds into `todo`, as it once carried the list into the store. */
todoStore=loadStore("todo"); if(!Object.keys(todoStore).length) todoStore=loadStore("inbox");
(function(){ var q=loadQ("cadence:pendingDocs"), moved=false;
  Object.keys(q).forEach(function(path){ if(path.indexOf("inbox/")===0){ q["todo/"+path.slice(6)]=q[path]; delete q[path]; moved=true; } });
  if(moved) saveQ("cadence:pendingDocs",q); })();
periodicStore=loadStore("periodic"); projectStore=loadStore("projects"); todoRev++;
/* Before the TODO list, a breakdown was its own record. One still open is what it always
   was — a TODO item that blocks an Office item — and is carried over once; from
   the store it is carried into the store's todo, so every device holds the one
   item and a close reaches them all. One already closed here is not carried over: its old record is closed. */
var pendingBreaks=null;
function adoptBreakdowns(list,shared){
  var changed=false;
  (list||[]).forEach(function(b){
    if(!b || !b.id || !b.open) return;
    var had=todoStore[b.id];
    if(had && had.done){
      if(shared) closeBreakdown(b.id,closedOn(had)||logicalToday());
      return;
    }
    if(had && !(shared && had.at===new Date(0).toISOString())) return;
    /* Until the Rule that names the default project has loaded, the breakdown waits
       (adoptRule takes it up again): a project of null would stay in the shared
       list, in no project's TODO list. */
    if(!defaultProject()){ pendingBreaks={list:list,shared:shared}; return; }
    var it={project:defaultProject(),what:b.what,blocks:b.blocks||[],captured:b.opened||logicalToday(),sessions:b.sessions_used||0};
    if(shared){ putDoc(todoStore,"todo","todo",b.id,it); return; }
    it.id=b.id; it.at=new Date(0).toISOString();
    todoStore[b.id]=it; changed=true;
  });
  if(changed) saveStore("todo",todoStore);
}
try{var lb=localStorage.getItem("cadence:breaks"); if(lb) adoptBreakdowns(JSON.parse(lb));}catch(e){}

function pick(id){ return document.getElementById(id).content.cloneNode(true); }
shell=Shell.mount({
  root:document.getElementById("app"),
  toolbar:pick("t-toolbar"),
  nav:pick("t-nav"),
  content:pick("t-content"),
  storageKey:"cadence",
  navLabel:"Cadence navigation",
  menuLabel:"Background cards",
  contextLabel:"Context"
});

/* The two cards worth leaving open beside the day. Everything else is transient —
   opened by a row or a bell, closed when it is dealt with. */
defineCard("focus","This focus session",function(host){
  var now=focusNow();
  if(!now.id){ host.textContent=""; para(host,"empty",now.why); return; }
  paintFocus(host,now.id);
  /* Which one: chosen by the clock, the card says so rather than leave it inferred. */
  host.insertBefore(el("div","step",now.it.do),host.firstChild);
},true);
defineCard("blocked","Blocked",paintBlocked,true);
defineCard("budget","Budget",paintBudget,true);
/* Whoever opened it — the app, or the reader from the ⋮ menu — it gets painted.
   Whatever closed it, what it was part-way through saying goes with it. */
shell.on("open",function(e){ paintCard(e.id); });
shell.on("close",function(e){
  delete drafts[e.id];
  /* A group's parts draft their times under their own ids, on the group's card. */
  if(e.id.indexOf("row:")===0){ var it=itemById(e.id.slice(4)); if(it) (it.children||[]).forEach(function(k){ delete drafts[rowId(k)]; }); }
  if(e.id.indexOf("bell:")===0) delete bellDraft[e.id.slice(5)];
});
shell.on("mode",syncTail);
window.addEventListener("resize",syncTail);

/* Show another day. The day's own drafts and its bell and row cards go: they were
   about the day being left, and would write what they hold to the one arriving.
   What the day being left still owes the store is sent first; the new day shows
   this device's copy, then the store's as it arrives, with anything recorded
   meanwhile kept over it. */
function setViewDate(d){
  /* A day chosen, by hand or by the turn, is where the page is now: a turn still
     waiting on a card is spent, so closing that card does not move the page again. */
  turned=false;
  flushAll();
  viewDate=d;
  Object.keys(cards).forEach(function(id){ if(id.indexOf("bell:")===0 || id.indexOf("row:")===0) shell.close(id); });
  bellDraft={};
  Object.keys(drafts).forEach(function(id){ if(id.indexOf("todo:")!==0 && id.indexOf("dict:")!==0 && id.indexOf("periodic:")!==0 && id.indexOf("proj:")!==0) delete drafts[id]; });
  adopt(viewOf(loadLocal(viewDate)||{},viewDate));
  render(); positionFor(true);
  watchDay(viewDate);
}

Array.prototype.forEach.call(document.querySelectorAll("#navList [data-view]"),function(b){
  b.addEventListener("click",function(){
    setView(b.dataset.view);
    if(b.dataset.view==="today") positionFor(true);
    else shell.scroller().scrollTop=0;
  });
});
document.getElementById("datePick").addEventListener("change",function(){
  if(this.value) setViewDate(this.value);
});
document.getElementById("nowNext").addEventListener("click",askNextBell);
document.getElementById("backToday").addEventListener("click",function(){ setViewDate(logicalToday()); });

drawOrSay();
setTimeout(function(){ positionFor(false); },250);
/* Once a minute, and whenever the page is shown again: the toolbar, the departure
   notices and which block is now. When the day turns at DAY_START the page goes to
   the new day, whichever day it was showing: a page left open overnight on another
   day would otherwise greet the morning with that day's ticks as today's. It waits
   while a row or bell card is open — that card is part-way through recording the
   day it was opened on, and finishes there — and follows once the card closes, or
   an hour into the new day at the latest: a card left open, docked beside the day,
   would otherwise hold the page on yesterday all morning. Between turns, a page
   showing another day stays on it. */
var today=logicalToday(), turned=false, TURN_HOLD=60;
function dayCardOpen(){
  return Object.keys(cards).some(function(id){
    return (id.indexOf("row:")===0 || id.indexOf("bell:")===0) && shell.isOpen(id); });
}
function clockTick(){
  if(!ruleSeen) return;
  var t=logicalToday();
  if(t!==today){ today=t; turned=true; }
  if(turned && (!dayCardOpen() || nowMins()>=hm(DAY_START)+TURN_HOLD)){ turned=false; if(viewDate!==t){ setViewDate(t); return; } }
  renderToolbar(); renderFixtures(); markNow();
}
setInterval(clockTick,60000);
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") clockTick(); });
shell.on("close",function(){ if(turned) setTimeout(clockTick,0); });

if(window.claude&&window.claude.use){
  window.claude.use("db").then(function(d){
    if(!d) return;
    db=d;
    /* What waited for the store goes first; then the days, and the day on screen. */
    flushAll();
    syncDays();
    /* The Rule, as the store has it now and whenever /ordo changes it. It is kept in
       this browser only once it has been drawn: one the page cannot draw (written
       past the gate, or by a compiler this page is not the match of) is let go, the
       page goes back to the last it drew, and it takes the next the store sends. */
    (function followRule(){
      d.doc("rule/compiled").onSnapshot(function(sn){
        var first=!ruleSeen;
        if(!sn.exists || !adoptRule(sn.data())) return;
        try{
          /* The first Rule this browser has seen: the day starts from it. */
          if(first){ today=logicalToday(); setViewDate(today); }
          else { render(); clockTick(); }
        }catch(e){
          if(window.console) console.error("cadence: the store's Rule could not be drawn",e);
          ruleSeen=null;
          try{ adoptRule(JSON.parse(localStorage.getItem("cadence:rule")||"null")); }catch(e2){}
          drawOrSay();
          return;
        }
        try{ localStorage.setItem("cadence:rule",ruleSeen); }catch(e){}
      },function(){ setTimeout(followRule,30000); });
    })();
    /* The docket's store, captured on any device, reaches this one, and keeps
       reaching it while the page is open. */
    function docs(snap){ return snap.docs.map(function(doc){return Object.assign({id:doc.id},doc.data());}); }
    /* A snapshot from the cache is the first pages of a subscription, not the whole
       collection (db.d.ts): a doc missing from it may well be in the store. The
       once-per-device migration, which sends what the store lacks, waits for one
       the server stands behind. */
    function follow(coll,store,then){
      d.collection(coll).onSnapshot(function(snap){
        var ds=docs(snap), sure=!(snap.metadata&&snap.metadata.fromCache);
        if(sure && !migrated(coll)){ migrateStore(store,coll,ds); markMigrated(coll); flushAll(); }
        var changed=mergeStore(store,coll,ds);
        if(then) changed=then(ds,sure) || changed;
        if(changed) render();
      },function(){ setTimeout(function(){ follow(coll,store,then); },30000); });
    }
    var broke=false;
    follow("todo",todoStore,function(ds,sure){
      if(broke || !sure) return false; broke=true;
      d.collection("breakdowns").get().then(function(s2){ adoptBreakdowns(docs(s2),true); render(); }).catch(function(){});
      return false;
    });
    follow("periodic",periodicStore);
    follow("projects",projectStore,function(ds){
      var t=threads(), changed=false;
      /* The map's date follows the store's line, whichever device typed it. */
      ds.forEach(function(v){
        var line=(projectStore[v.id]||{}).thread;
        if(!line || (t[v.id] && t[v.id].line===line)) return;
        t[v.id]={line:line,at:projectStore[v.id].threadAt||projectStore[v.id].at}; changed=true;
      });
      if(changed) saveThreads(t);
      return changed;
    });
  }).catch(function(){});
}

})();
</script>
