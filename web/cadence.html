<title>Cadence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  /* @inline:begin web/tokens.css — generated; edit that file, not this */
  :root{
    --ground:#F5F7F6; --surface:#FFFFFF; --raised:#FAFBFA;
    --ink:#1B211F; --soft:#5B6462; --faint:#687170;
    --line:#E0E5E2; --line-soft:#EDF0EE; --control:#87908D;
    --accent:#35655A; --accent-ink:#FFFFFF; --accent-soft:#E4EEEA;
    --blocked:#8A7B4F; --blocked-soft:#F3EEE0;
    --serif:"Spectral",Georgia,"Times New Roman",serif;
    --sans:-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#121614; --surface:#1A1F1D; --raised:#202624;
    --ink:#E7EBE9; --soft:#9AA39F; --faint:#848D89;
    --line:#2A312E; --line-soft:#232A27; --control:#6A736F;
    --accent:#72A793; --accent-ink:#10201B; --accent-soft:#1E2E29;
    --blocked:#B9A570; --blocked-soft:#282419;
  }}
  /* @dark:begin — generated from the prefers-color-scheme block above; edit that, not this */
  :root[data-theme="dark"]{
    --ground:#121614; --surface:#1A1F1D; --raised:#202624;
    --ink:#E7EBE9; --soft:#9AA39F; --faint:#848D89;
    --line:#2A312E; --line-soft:#232A27; --control:#6A736F;
    --accent:#72A793; --accent-ink:#10201B; --accent-soft:#1E2E29;
    --blocked:#B9A570; --blocked-soft:#282419;
  }
  /* @dark:end */
  /* @inline:end */
  /* @inline:begin web/layout.css — generated; edit that file, not this */
  html:has(.shell), html:has(.shell) body { height: 100%; }

  /* The shell sizes its own rails and cannot assume the host reset border-box —
     a published artifact's skeleton does not. Named rather than `.shell *`, so an
     app's own content keeps whatever box model it chose. */
  .shell, .shell-toolbar, .shell-toolbar-slot, .shell-nav, .shell-content,
  .shell-content-scroll, .shell-content-footer,
  .shell-context, .shell-card, .shell-card-bar, .shell-card-body,
  .shell-btn, .shell-menuwrap, .shell-menu, .shell-scrim { box-sizing: border-box; }

  .shell{
    /* Override these on .shell to retune the layout; nothing below hard-codes them. */
    --shell-nav-w: 232px;
    --shell-context-w: 336px;
    --shell-content-min: 480px;
    /* Narrower than this, the strip of content an overlaid card would leave is
       no use to read and a trap to tap, so the card covers the content instead. */
    --shell-context-strip-min: 120px;
    --shell-toolbar-h: 52px;
    --shell-gap: 10px;
    --shell-z-content: 0;
    --shell-z-context: 20;
    --shell-z-scrim: 30;
    --shell-z-nav: 40;
    --shell-z-menu: 60;

    /* Nothing the shell holds may push it wider than the screen. A word longer than
       its column — a pasted link, say — breaks where it has to rather than dragging
       its region sideways. Inherited, so it covers the app's content too. */
    overflow-wrap: break-word;

    /* The two side columns, as they currently stand. A collapsed region takes no
       width at all — the spec is that content grows into the space, not that an
       empty rail sits there — so each state below only zeroes its own column. */
    --_nav: var(--shell-nav-w);
    --_ctx: var(--shell-context-w);

    height: 100%;
    display: grid;
    grid-template-columns: var(--_nav) minmax(0, 1fr) var(--_ctx);
    /* The third row is the content footer's. It is a row of the shell rather than
       of the content area so that an overlaid context column can stop above it. */
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas:
      "toolbar toolbar context"
      "nav     content context"
      "nav     content context";
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
  }

  /* An overlaid region is drawn over the content, not beside it, so it takes no
     column either. */
  .shell[data-nav="overlay"],
  .shell[data-nav-open="false"]{ --_nav: 0px; }
  .shell[data-context="none"],
  .shell[data-context="overlay"],
  .shell[data-context="cover"]{ --_ctx: 0px; }

  /* ---- toolbar ------------------------------------------------------------ */

  .shell-toolbar{
    grid-area: toolbar;
    min-height: var(--shell-toolbar-h);
    display: flex;
    align-items: center;
    gap: var(--shell-gap);
    padding: 6px 10px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  /* The app's own toolbar content. It gets the middle and is free to do as it
     likes there, including scrolling sideways when it runs out of room. */
  .shell-toolbar-slot{
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: var(--shell-gap);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .shell-toolbar-slot::-webkit-scrollbar{ display: none; }

  /* ---- the two icon buttons the shell owns -------------------------------- */

  /* 40px: a thumb's target, not a cursor's. The toolbar's 52px holds it. */
  .shell-btn{
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px; height: 40px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--soft);
    cursor: pointer;
  }
  .shell-btn:hover{ background: var(--raised); color: var(--ink); }
  .shell-btn[aria-expanded="true"]{ background: var(--accent-soft); color: var(--accent); }
  .shell-btn svg{ width: 18px; height: 18px; display: block; }
  .shell-btn:focus-visible,
  .shell-nav :is(a, button):focus-visible,
  .shell-menu button:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- background-card menu ----------------------------------------------- */

  .shell-menuwrap{ position: relative; flex: none; }
  .shell-menu{
    position: absolute;
    top: calc(100% + 6px); right: 0;
    z-index: var(--shell-z-menu);
    min-width: 220px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,.14);
  }
  .shell-menu[hidden]{ display: none !important; }
  .shell-menu button{
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-height: 40px;
    padding: 7px 8px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .shell-menu button:hover{ background: var(--raised); }
  /* A tick that holds its column whether or not it is showing, so the labels line
     up and the row does not jump when it is toggled. */
  .shell-menu .shell-tick{ flex: none; width: 14px; color: var(--accent); visibility: hidden; }
  .shell-menu button[aria-checked="true"] .shell-tick{ visibility: visible; }

  /* ---- navigation ---------------------------------------------------------- */

  .shell-nav{
    grid-area: nav;
    width: min(var(--shell-nav-w), 100%);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 12px 10px;
    background: var(--surface);
    border-right: 1px solid var(--line);
  }
  .shell[data-nav-open="false"] .shell-nav{ display: none; }

  /* Overlaid regions are placed in the grid rather than positioned absolutely, so
     nothing here has to know how tall the toolbar ended up. The nav starts at the
     second row — under the toolbar, which stays reachable, since the button that
     closes the nav lives in it. */
  .shell[data-nav="overlay"] .shell-nav{
    grid-row: 2 / -1;
    grid-column: 1 / -1;
    justify-self: start;
    z-index: var(--shell-z-nav);
    box-shadow: 4px 0 24px rgba(0,0,0,.18);
  }

  .shell-scrim{
    grid-row: 2 / -1;
    grid-column: 1 / -1;
    z-index: var(--shell-z-scrim);
    background: rgba(10,14,12,.38);
  }
  .shell-scrim[hidden]{ display: none !important; }

  /* ---- content ------------------------------------------------------------- */

  /* The content area is a column of two: the part that scrolls, and a footer pinned
     under it that does not. The footer collapses to nothing while the app leaves it
     empty, so a page that never uses one lays out exactly as it did before there was
     one — and an app shows and hides its footer by filling and emptying it, with no
     second switch to keep in step. The two rows are the shell's own (subgrid), which
     is what lets an overlaid context column cover the one and leave the other. */
  .shell-content{
    grid-area: content;
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-rows: subgrid;
    z-index: var(--shell-z-content);
  }
  .shell-content-scroll{
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;   /* the content fits the screen; it never pans sideways */
    overscroll-behavior: contain;
    padding: 0 16px;
  }
  /* Unlike the toolbar slot, the footer never scrolls sideways: it is part of the
     content, and the content fits the screen. What does not fit on one line wraps
     to the next, and a single item longer than the strip wraps inside itself. */
  .shell-content-footer{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--shell-gap);
    padding: 8px 16px;
    background: var(--surface);
    border-top: 1px solid var(--line);
    min-width: 0;
  }
  .shell-content-footer > *{ min-width: 0; max-width: 100%; }
  .shell-content-footer:empty{ display: none; }

  /* ---- context ------------------------------------------------------------- */

  .shell-context{
    grid-area: context;
    /* Never wider than what it is given. Below about 360px the fixed column would
       hang off the left edge and clip the card, which is a real phone, not a
       hypothetical one. */
    width: min(var(--shell-context-w), 100%);
    display: grid;
    /* Even shares of the column, each card scrolling inside its own row. The one
       column is pinned to the width given: left `auto`, WebKit sizes it to the
       longest unwrapped line inside — a card title — and the card runs off the
       screen. Chromium happens not to, which is why this is spelled out. */
    grid-template-columns: minmax(0, 1fr);
    grid-auto-rows: minmax(0, 1fr);
    gap: var(--shell-gap);
    padding: var(--shell-gap);
    background: var(--ground);
    border-left: 1px solid var(--line);
    overflow: hidden;
  }
  .shell[data-context="none"] .shell-context{ display: none; }

  /* Inline, the context column runs the full height beside the toolbar. Overlaid,
     it covers the content and stops below the toolbar — it renders over content, and
     covering the toolbar would bury the ⋮ button that toggles the very cards doing
     the covering. It stops above the content footer too: the footer is where an app
     puts what must not scroll away, and a card left open would otherwise hide it for
     as long as it stayed open. */
  .shell[data-context="overlay"] .shell-context,
  .shell[data-context="cover"] .shell-context{
    grid-row: 2 / 3;
    grid-column: 2 / -1;
    justify-self: end;
    z-index: var(--shell-z-context);
    box-shadow: -4px 0 24px rgba(0,0,0,.18);
  }
  /* On a phone an overlaid card left a strip of content a few dozen pixels wide
     beside it: the labels hidden, the controls live, so a tap meant to dismiss the
     card acted on something unseen. Covered, the card takes the content's whole
     width, and layout.js makes what is under it inert until it closes. */
  .shell[data-context="cover"] .shell-context{
    grid-column: 1 / -1;
    width: 100%;
    border-left: 0;
    box-shadow: none;
  }

  .shell-card{
    display: grid;
    grid-template-columns: minmax(0, 1fr);   /* see .shell-context */
    grid-template-rows: auto minmax(0, 1fr);
    min-width: 0;
    min-height: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .shell-card-bar{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 6px 6px 12px;
    background: var(--raised);
    border-bottom: 1px solid var(--line-soft);
  }
  .shell-card-title{
    flex: 1 1 auto;
    min-width: 0;
    margin: 0;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .shell-card-body{
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 12px;
  }
  /* A card opened from the keyboard takes the focus onto its body (layout.js), so
     the body shows where focus is the way every control does. */
  .shell-card-body:focus-visible{ outline: 2px solid var(--accent); outline-offset: -2px; }

  @media (prefers-reduced-motion: reduce){
    .shell *{ animation: none !important; transition: none !important; }
  }
  /* @inline:end */

  /* The shell above draws the toolbar, the rail and the cards. Everything below is
     Cadence's own — what goes inside them. No rule here names a shell- class. */
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{background:var(--ground);color:var(--ink);font-family:var(--sans);
       margin:0;-webkit-font-smoothing:antialiased}
  #app{font-size:14px}
  .wrap{max-width:62ch;margin:0 auto;padding-block:16px 56px}

  /* ---- toolbar ---- */
  /* The current item is the one thing here that gives way when the slot runs out
     of room: it shrinks, and ellipsises, rather than the slot scrolling sideways
     and shearing it mid-word at the ⋮ button. */
  .tb{display:flex;align-items:center;gap:14px;white-space:nowrap;flex:1 1 auto;min-width:0}
  .tb>*{flex:none}
  .blkdate{font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--faint);font-variant-numeric:tabular-nums}
  .navlist input[type=date]{width:100%;font:12px var(--sans);color:var(--ink);
    background:var(--raised);border:1px solid var(--line);border-radius:7px;
    padding:6px 8px;margin:0 0 2px}
  /* What you are doing sits above how long you have to do it — two facts about the
     same moment, so they read as one column rather than two items in a row. */
  .tbStack{display:flex;flex-direction:column;justify-content:center;gap:1px;
    flex:0 1 auto;min-width:0;position:relative;min-height:40px}
  .tbDoing{font-family:var(--serif);font-size:15px;font-weight:600;max-width:34ch;
    overflow:hidden;text-overflow:ellipsis}
  .tbDoing.done{color:var(--faint);font-weight:400;font-style:italic}
  .tbBlock{color:var(--accent);font-weight:600;text-decoration:none;font-size:12.5px;
    border-bottom:1px solid var(--accent-soft)}
  /* The next bell's time, which is an instruction. How long until it is a countdown,
     and shows only when this is tapped — see renderToolbar. */
  .tbNext{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;
    font-family:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer;
    overflow:hidden;text-overflow:ellipsis}
  .tbNext:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tbBack{align-self:flex-start;font:12px var(--sans);color:var(--accent);background:none;
    border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  /* Each is one 14px line, and the toolbar's 52px has no room for a 40px button
     under the line above it. So the stack is 40px tall and the button that shows
     takes all of it: a tap on what you are doing, or on the day's name, is a tap on
     the line under it. (Positioned against the stack, the cover escapes the
     button's own overflow clip.) */
  .tbNext::before,.tbBack::before{content:"";position:absolute;inset:0}
  /* The fixture notices, in the content footer the shell pins under the day. They
     are the one thing that must not scroll away: everything else on the page can be
     caught up on later, and a departure cannot. */
  a.leave{display:inline-flex;align-items:center;min-height:40px;padding:6px 12px;
    border-radius:7px;background:var(--accent-soft);
    color:var(--accent);font-weight:600;font-size:12px;text-decoration:none;
    font-variant-numeric:tabular-nums}
  /* Past leave-by. The blocked colour, not a red one: the fixture is now consuming
     the block, which is a thing to notice, not a failure the page is entitled to
     judge. */
  a.leave.late{background:var(--blocked-soft);color:var(--blocked)}
  .ration{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .ration .n{font-size:13px;color:var(--soft);flex:1 1 14em;font-variant-numeric:tabular-nums}
  .ration .n b{color:var(--ink);font-weight:600}
  .ration button{border:1px solid var(--line);background:var(--raised);color:var(--ink);
    border-radius:8px;padding:7px 12px;font:600 13px var(--sans);cursor:pointer}

  /* ---- navigation ---- */
  .navlist{display:flex;flex-direction:column;gap:2px}
  .navlist b{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    color:var(--faint);padding:12px 8px 4px}
  .navlist button{text-align:left;font:inherit;font-size:13.5px;color:var(--soft);
    cursor:pointer;background:transparent;border:0;border-radius:7px;padding:7px 9px;
    min-height:40px;display:flex;align-items:center;gap:8px}
  .navlist button:hover{background:var(--raised);color:var(--ink)}
  .navlist button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);
    font-weight:600}
  .navlist button i{font-style:normal;font-size:11px;color:var(--faint);margin-left:auto;
    font-variant-numeric:tabular-nums}
  .navlist button.isnow i{color:var(--accent)}

  /* ---- blocks and rows ---- */
  section.blk{margin-top:24px;scroll-margin-top:12px}
  section.blk.now .blkhd b{color:var(--accent)}
  .blkhd{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
  .blkhd b{font-family:var(--serif);font-size:19px;font-weight:600}
  .blkhd i{font-style:normal;font-size:12px;color:var(--faint);
    font-variant-numeric:tabular-nums}
  .bellbox{background:var(--surface);border:1px solid var(--line);border-radius:11px;
    padding:13px 15px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
  .bellbox .bellmain{flex:1;min-width:0}
  .bellbox.answered{background:var(--accent-soft);border-color:var(--accent-soft)}
  .bellbox .when{font-size:12.5px;color:var(--accent);font-weight:700;
    font-variant-numeric:tabular-nums}
  .bellbox .when.yet{color:var(--faint);font-weight:500;padding:6px 0}
  button.answer{width:100%;border:0;border-radius:10px;cursor:pointer;
    background:var(--accent);color:var(--accent-ink);
    font:600 14.5px var(--sans);padding:13px}
  button.answer:active{transform:translateY(1px)}

  /* The context button. One on every row and every answer card — the single way in
     to everything secondary, which is why no row carries its own controls any more.
     A thumb's size, and set off from the row by a gap that is neither: the row is
     one toggle, and a near miss on this button must not tick it. */
  .ctxBtn{flex:none;align-self:center;margin:0 10px 0 6px;width:40px;height:40px;
    display:grid;place-items:center;cursor:pointer;color:var(--faint);
    background:transparent;border:1px solid var(--control);border-radius:8px}
  .bellbox .ctxBtn{align-self:flex-start;margin:0}
  .ctxBtn:hover{color:var(--accent);border-color:var(--accent)}
  .ctxBtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .ctxBtn svg{width:15px;height:15px}

  ul.items{list-style:none;margin:0;padding:0;
    border:1px solid var(--line);border-radius:11px;overflow:hidden;
    background:var(--surface)}
  ul.items li+li{border-top:1px solid var(--line-soft)}
  ul.items li{display:flex;align-items:stretch}
  li.na .what2 b{color:var(--faint);text-decoration:none}
  li.na .tick{border-style:dashed;opacity:.55;position:relative}
  li.na .tick::after{content:"";width:9px;height:1.5px;background:var(--faint);
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  li.na .tick svg{opacity:0}
  .row{display:flex;align-items:flex-start;gap:12px;flex:1;min-width:0;
    padding:13px 14px;background:transparent;border:0;text-align:left;
    font:inherit;color:inherit;cursor:pointer}
  .row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .tick{flex:none;width:20px;height:20px;border-radius:50%;margin-top:1px;
    border:1.5px solid var(--control);display:grid;place-items:center}
  .row[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
  .tick svg{width:11px;height:11px;opacity:0;stroke:var(--accent-ink)}
  .row[aria-pressed="true"] .tick svg{opacity:1}
  .tick.some{background:var(--accent-soft);border-color:var(--accent)}
  .tick.some svg{opacity:1;stroke:var(--accent)}
  .what2{flex:1;min-width:0}
  .what2 b{display:block;font-weight:500;font-size:14.5px;line-height:1.35}
  .row[aria-pressed="true"] .what2 b{color:var(--faint);text-decoration:line-through;
    text-decoration-thickness:1px}
  .what2 span{display:block;font-size:12px;color:var(--soft);margin-top:3px;
    line-height:1.4}
  .at{flex:none;font-size:11.5px;color:var(--faint);margin-top:2px;
    font-variant-numeric:tabular-nums}
  .flag{flex:none;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 6px;border-radius:5px;margin-top:2px;
    background:var(--blocked-soft);color:var(--blocked);font-weight:700}
  li.is-blocked .row{cursor:default}
  li.is-blocked .tick{border-style:dashed;opacity:.5}

  h2{font:600 11.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);margin:28px 0 0}
  .note{font-size:13px;color:var(--soft);line-height:1.5;margin:10px 0 0}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-top:12px}

  .grid{display:grid;grid-template-columns:auto repeat(7,1fr);gap:9px 5px;
    align-items:center;margin-top:14px}
  .grid .lbl{font-size:12.5px;color:var(--soft);padding-right:8px;white-space:nowrap}
  .grid .hd{font-size:10px;color:var(--faint);text-align:center;text-transform:uppercase}
  .dot{width:15px;height:15px;border-radius:50%;margin:0 auto;
    border:1.5px solid var(--control)}
  .dot.on{background:var(--accent);border-color:var(--accent)}
  .dot.na{border-style:dotted;opacity:.45}
  .dot.away{border-style:dashed;opacity:.6}
  .counts{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
  .chip{font-size:12.5px;color:var(--soft);background:var(--raised);

function repairStatus(x){
  var n=sessionsUsed(x);
  if(x.escalated==="money") return "A money problem, not a time problem: calling someone is the work now.";
  if(n>=TIMEBOX.sessions) return plural(n,"diagnostic session")+" spent: calling someone is the default, not the failure.";
  return "A repair: "+TIMEBOX.minutes+" minutes a session, "+TIMEBOX.sessions+" at most, then calling someone is the default. Sessions used: "+n+" of "+TIMEBOX.sessions+".";
}
/* A session ends with one of three words (the TODO policy › timebox.at_the_bell):
   resolved, money, or back to the sort — which counts it, in the session it ended. */
function diagnosed(x){
  var m={}, s=sessionNow();
  Object.keys(x.diagnosed||{}).forEach(function(k){ m[k]=x.diagnosed[k]; });
  m[s.date+":"+(s.focus||"day")]=true;
  putTodo(x.id,{diagnosed:m});
}
/* What a blocked row says. The repair stands in the work order at this item's day;
   the row keeps its place, blocked and not missed. */
function blockedLine(b){
  return "Blocked — "+b.what+". "+(b.done ? "Not missed; it was open that day." : "Not missed; it is on the TODO list.");
}
/* ===== follow-ups ==============================================================
   A work item may carry `then: {what, sessions}`: once a bell records it, what it
   names is due in each of the next `sessions` work sessions that day — laundry,
   started in focus 1, moves at focus 2 and is folded at focus 3. Two things follow
   from the one field, with no special case for any item: the item starts only in a
   session with that many more after it (so laundry, on Sunday's single focus slot,
   never), and the follow-up rides along with the sessions it lands in, never
   spending one or counting against an allocation. */
function focusSlots(date){
  var out=[];
  blocksFor(date).forEach(function(b){ b.items.forEach(function(it){ if(it.focus) out.push(it); }); });
  return out;
}
function focusIndex(focusId){
  var fs=focusSlots(viewDate);
  for(var i=0;i<fs.length;i++) if(fs[i].id===focusId) return i;
  return -1;
}
function startFits(x,focusId){
  if(!x.then || !focusId) return true;
  var i=focusIndex(focusId);
  return i>=0 && focusSlots(viewDate).length-1-i>=x.then.sessions;
}
/* The work sessions before this one, most recent first, across days: a load
   recorded at the day's last session still has to move at the next day's first. */
function sessionsBefore(focusId,count){
  var out=[], date=viewDate, fs=focusSlots(date), j=focusIndex(focusId);
  for(var guard=0; out.length<count && guard<8; guard++){
    var rec=date===viewDate?state:loadDay(date);
    for(var i=j-1;i>=0 && out.length<count;i--) out.push({date:date,it:fs[i],rec:rec});
    date=addDays(date,-1); fs=focusSlots(date); j=fs.length;
  }
  return out;
}
/* The work session something done right now belongs to: the one the bell just
   closed while its block's Office stretch runs (a load put in over lunch is focus
   1's, and moves at focus 2), else the one this block holds, else the day's first.
   Today's, whatever day is on screen. */
function sessionNow(){
  var today=logicalToday(), bs=blocksFor(today), fs=focusSlots(today), m=nowMins(), cur=null;
  var present=function(id){ return fs.some(function(it){ return it.id===id; }); };
  for(var i=0;i<bs.length;i++){
    if(i>0 && m<bs[i].at) break;
    if(present(bs[i].breaks)) cur=bs[i].breaks;
    else bs[i].items.forEach(function(it){ if(it.focus) cur=it.id; });
  }
  return {date:today,focus:cur||(fs[0]?fs[0].id:null)};
}
function followUps(focusId,pid){
  var out=[];
  if(!focusId || focusIndex(focusId)<0) return out;
  /* Every TODO item a follow-up can come from: finished ones too, since finishing
     the item is exactly when what it commits is due. Only a removed one is gone. */
  periodicAll().concat(todoEvery().filter(function(x){ return !x.removed && x.what; })).forEach(function(x){
    if(!x.then || (pid && x.project!==pid)) return;
    var back=sessionsBefore(focusId,x.then.sessions), st=x.started||{};
    for(var i=0;i<back.length;i++){
      var f=((back[i].rec||{}).focus||{})[back[i].it.id]||{};
      /* Recorded at a bell, or started from its card ("Done today"), which says
         which session it went in. */
      if((f.undertakings||[]).indexOf(x.id)>=0 || (st.date===back[i].date && st.focus===back[i].it.id)){
        out.push({id:"then:"+x.id,what:x.then.what,project:x.project,follow:true,
                  why:"Follows "+x.what+", recorded for "+back[i].it.do+(back[i].date!==viewDate?" on "+back[i].date:"")+
                      ". Due in each of the "+plural(x.then.sessions,"session")+" after it; it rides along and does not spend this one."});
        return;
      }
    }
  });
  return out;
}
function startWhy(x){
  return "Starts only in a session with "+plural(x.then.sessions,"more")+" after it today, for "+x.then.what.toLowerCase()+".";
}
/* How far a TODO item is overdue, as a fraction of its cadence: one with a date is
   due on it, counted from its capture; one without is due TODO_CADENCE days after
   it was captured (the TODO policy › policy.due_after_days), so it rises as it ages
   (hypomnemata › allocation). An item another tool owns (its `source`) and has not
   dated is neither due nor overdue: it does not age, and stands last in the tier
   until its owner dates it (hypomnemata › undertaking). */
function ownerOf(x){ return x && x.source && typeof x.source.owner==="string" ? x.source.owner : null; }
function todoStatus(x){
  var held=ownerOf(x);
  if(held && !x.by) return {on:null,over:null,frac:-Infinity,dated:false,held:held};
  var cap=String(x.captured||viewDate).slice(0,10), on=x.by||addDays(cap,TODO_CADENCE);
  var over=daysBetween(on,viewDate);
  return {on:on,over:over,frac:over/Math.max(1,daysBetween(cap,on)),dated:!!x.by};
}
function todoWhy(st){
  if(st.held) return "Held by "+st.held+", undated: it does not age, and waits last until "+st.held+" dates it";
  var when=st.dated ? "its date, "+st.on : words(TODO_CADENCE)+" days from capture, "+st.on;
  return st.over>0 ? "Overdue by "+plural(st.over,"day")+" against "+when
       : st.over===0 ? "Due today: "+when
       : "Due "+when;
}
/* Where a blocker of an Office item or a fixture enters the order: at the next day
   that thing is on, as a daily item due that day — today is due, not overdue. The
   Office enters the order only this way. */
function stopsDate(x){
  var best=null;
  (x.blocks||[]).forEach(function(id){
    var d=isOffice(id) ? nextOfficeDate(id) : isFixture(id) ? nextFixtureDate(id) : null;
    if(d && (!best || d<best.on)) best={on:d,id:id};
  });
  return best ? {on:best.on,what:labelOf(best.id)} : null;
}
/* The meetings of a project: the one in this session, or with no session named,
   every one on the viewed day. A meeting takes its session outright. */
function meetingsFor(pid,focusId){
  var out=[], d=parseYmd(viewDate);
  if(focusId){
    var m=meetingIn(focusId,viewDate);
    if(m && m.project===pid) out.push(m);
    return out;
  }
  return commitmentsFor(DAYS[d.getDay()],viewDate).filter(function(c){ return c.meeting && c.project===pid && !cancelledOn(c.id,viewDate); });
}
/* One project's work, in order (hypomnemata › kinds, › allocation): three queues,
   three tiers of priority, never a matrix. First the meetings of the session.
   Second, periodic items and TODO items together, by how far overdue each is as a
   fraction of its cadence. Third, canon: the frontier hypomnemata by pressure, then
   dictations, oldest first. A blocker takes the tier and the rank of what it stops
   and stands just before it, and the two are drawn bound. Follow-ups ride above as a
   strip; what cannot start in this session, or is not yet due, waits below. Every
   line carries its reason, because a ranking you cannot argue with is a ranking you
   will start ignoring. */
function rankWork(pid,focusId){
  var follow=[], meet=[], due=[], front=[], dict=[], later=[], owed={};
  followUps(focusId,pid).forEach(function(f){ follow.push({o:f,why:f.why}); owed[f.id]=f; });
  meetingsFor(pid,focusId).forEach(function(m){
    meet.push({o:{id:m.id,what:m.short||m.what,project:pid,meeting:true},
               why:"A meeting"+(m.start?" at "+fmt(hm(m.start)):"")+": it takes its session outright and counts as one used."});
  });
  periodicFor(pid).forEach(function(c){
    var st=periodicStatus(c), every="every "+plural(c.cadence,"day");
    if(!st.due){ later.push({o:c,why:every+" · due "+st.on}); return; }
    if(!startFits(c,focusId)){ later.push({o:c,why:every+" · due. "+startWhy(c)}); return; }
    var why = st.over===null ? "Due — "+st.why+"."
            : st.over===0 ? "Due today, "+every+"."
            : "Overdue by "+plural(st.over,"day")+", "+every+(st.last?" — last done "+st.last:"")+".";
    due.push({o:c,frac:st.over===null?1:st.frac,why:why});
  });
  todoFor(pid).forEach(function(x){
    /* Started, and this session owes its follow-up: that is the work, not the item
       again — as a periodic item stops being due once a bell records it. */
    if(owed["then:"+x.id]){ later.push({o:x,why:"Started; this session owes it "+x.then.what.toLowerCase()+"."}); return; }
    if(!startFits(x,focusId)){ later.push({o:x,why:startWhy(x)}); return; }
    var st=todoStatus(x), rw=repairWhy(x), r={o:x,frac:st.frac,why:todoWhy(st)+rw+"."};
    /* One that stops an Office item or a fixture stands at that thing's next day,
       whatever its own date says: that day's rank as a daily item, due on it. */
    var sd=stopsDate(x);
    if(sd){ r.frac=daysBetween(sd.on,viewDate); r.why="Stops "+sd.what+(sd.on===viewDate?", which is today":" on "+sd.on)+rw+"."; }
    due.push(r);
  });
  frontierFor(pid).forEach(function(q){
    front.push({o:q,why:"On the frontier, pressure "+(q.pressure||0)+". Read and answered at the notebook."});
  });
  dictationsFor(pid).forEach(function(x){
    dict.push({o:x,why:"A dictation captured "+String(x.captured||"").slice(0,10)+": run it through the notebook's dictate entry point."});
  });
  due.sort(function(a,b){ return a.frac===b.frac ? 0 : b.frac>a.frac ? 1 : -1; });
  front.sort(function(a,b){ return (b.o.pressure||0)-(a.o.pressure||0); });
  dict.sort(function(a,b){ return String(a.o.captured||"").localeCompare(String(b.o.captured||"")); });
  var canon=front.concat(dict), out=[];
  follow.forEach(function(r){ r.step="follow"; out.push(r); });
  meet.forEach(function(r){ r.step="meeting"; out.push(r); });
  due.forEach(function(r){ r.step="due"; out.push(r); });
  canon.forEach(function(r){ r.step="canon"; out.push(r); });
  out=bindBlockers(out);
  later.forEach(function(r){ r.step="later"; out.push(r); });
  /* Blocked is not overdue (the TODO policy › policy.fields.blocks): what waits behind its repair
     is past its due date, and the line says so without the verdict. */
  out.forEach(function(r){
    var bb=r.step!=="follow" ? blockedBy(r.o,viewDate) : null;
    if(bb){ r.blocked=bb; r.why="Blocked by "+bb.what+" while it is open — waiting, not overdue. "+r.why.replace(/^Overdue by /,"Past its due date by "); }
  });
  return out;
}
/* A blocker stands just before the first thing it stops, in that thing's tier, and
   both rows say so. The order is built once, in rank order: a row that stops nothing
   here is put down with its blockers before it, each blocker's own blockers before
   it in turn, so a chain of any length settles. What a row stops outside these rows
   (another project's work, something not yet due) leaves it where its own rank put
   it. A meeting is never the target: its blocker stands in the second tier at the
   meeting's day (stopsDate), and the meeting row says it is blocked. Several blockers
   of one thing stand together before it, in their own order. Two rows that block
   each other (an older page could record that) are each put down once. */
function bindBlockers(rows){
  var targetOf={}, blockersOf={}, done={}, out=[];
  rows.forEach(function(r,i){
    var stops=r.o.blocks||[];
    if(!stops.length || r.step==="follow") return;
    for(var j=0;j<rows.length;j++){
      if(j!==i && rows[j].step!=="follow" && !rows[j].o.meeting && stops.indexOf(rows[j].o.id)>=0){
        targetOf[i]=j; (blockersOf[j]=blockersOf[j]||[]).push(i); return;
      }
    }
  });
  function put(i){
    if(done[i]) return;
    done[i]=true;
    var r=rows[i];
    (blockersOf[i]||[]).forEach(function(b){
      if(done[b]) return;
      var br=rows[b];
      br.binds=r.o.id; br.bindsWhat=r.o.question ? "the frontier question" : r.o.what; br.step=r.step;
      r.boundBy=br.o.id;
      put(b);
    });
    out.push(r);
  }
  rows.forEach(function(r,i){ if(targetOf[i]===undefined) put(i); });
  rows.forEach(function(r,i){ put(i); });
  return out;
}
function pickWithin(pid,focusId){
  var r=rankWork(pid,focusId).filter(function(x){
    return x.step!=="follow" && x.step!=="later" && x.step!=="meeting" && !x.blocked; })[0];
  if(!r) return null;
  return {what:r.o.what,why:r.why};
}
function recommend(focusId){
  var out=[], fc=focusCounts();

  followUps(focusId).forEach(function(f){ out.push({what:f.what,why:f.why,alongside:true}); });

  /* Once overdue, not on the due day: then it waits in its project's own sort, and a
     missed Sunday lands Monday. Several at once go in the sort's order, furthest past
     due as a fraction of the cadence first. */
  var ups=[];
  periodicAll().forEach(function(c){
    if(!c.outranks || !startFits(c,focusId) || blockedBy(c,viewDate)) return;
    var st=periodicStatus(c);
    if(!(st.over===null || st.over>0)) return;
    var why = st.over===null ? "Due — "+st.why+"."
            : "Overdue by "+plural(st.over,"day")+(st.last?" — last done "+st.last:"")+", on a "+c.cadence+"-day cadence.";
    ups.push({f:st.over===null?1:st.frac, r:{id:c.id,what:c.what,why:why+" Marked to outrank any project once overdue."}});
  });
  ups.sort(function(a,b){ return b.f-a.f; }).forEach(function(u){ out.push(u.r); });

  /* Furthest behind is the smallest share of its allocation used, ties to the larger
     allocation: a short week then falls on every project in proportion, not all on
     the smallest. A project with no allocation this week is behind nothing, so it
     comes last, as slack. */
  var meet=meetingCounts();
  PROJECTS.map(function(p){
    var done=fc[p.id]||0, alloc=allocOf(p);
    return {p:p,done:done,alloc:alloc,short:alloc-done,share:alloc>0?done/alloc:Infinity};
  }).sort(function(a,b){
    return (a.share-b.share) || (b.alloc-a.alloc);
  }).forEach(function(r,i){
    var m=meet[r.p.id]||0, short=halves(r.short);
    var why=countText(r.done)+" of "+r.alloc+" this week"+(m?" ("+plural(m,"meeting")+" counted)":"");
    if(!(r.alloc>0)) why+=" — unallocated this week.";
    else if(short>0) why+=", short by "+countText(r.short)+(i===0?" — furthest behind its allocation, as a share of it.":".");
    else if(short===0) why+=(r.short ? " — about on its allocation." : " — on its allocation.");
    else why+=" — "+countText(-r.short)+" over.";
    /* Spent is said of the count itself, not of it rounded to halves: a sixth of a
       slot short is still behind, and the sort treats it so. */
    if(i===0 && r.alloc>0 && !(r.short>0)) why+=" The week's allocation is spent; this slot is slack.";
    out.push({id:r.p.id,what:r.p.what,why:why,pick:pickWithin(r.p.id,focusId)});
  });

  return out;
}

/* ===== context cards =========================================================
   Cadence talks to the layout only through `shell`. Nothing below reads or writes
   a shell- class, which is what keeps the layout liftable into another repo. */
function defineCard(id,title,painter,background){
  if(!cards[id]){ shell.addCard({id:id,title:title,background:!!background}); cards[id]={}; }
  cards[id].paint=painter;
  shell.setTitle(id,title);
  return id;
}
function paintCard(id){ if(cards[id]) cards[id].paint(shell.body(id)); }
/* The shell paints a card on 'open'; one already open is repainted here, since it
   was opened for something that may have changed since it was last drawn. */
function openCard(id){
  if(shell.isOpen(id)) paintCard(id);
  shell.open(id,{focus:true});
}
/* What a card is part-way through saying lives here rather than in its fields, so
   a card can be repainted from state at any moment without losing any of it. It is
   dropped when the card closes. */
function draft(id){ return drafts[id]=drafts[id]||{}; }
/* A card's add form, just opened by a tap on "Add an item": the tap asked to type,
   so its heading takes the focus. Opening a card never does that on its own. */
function focusAdded(id){
  var t=shell.body(id).querySelector("[data-autofocus]");
  if(t) t.focus();
}

/* Where focus is inside a container, in a form that survives rebuilding it: the
   element's data-fk or id, else its place among the focusable things. A control
   the rebuild may take away — the bell's answer button, once the bell is answered
   — names in data-fk-then the one that stands in for it. A place counts only while
   there are as many things as before: once something has come or gone above it,
   the same place is another field, and typing on would put the words there. Then
   the focus stays with the card. */
var FOCUSABLE="button,input,textarea,select,a[href],[tabindex]";
function focusMark(host){
  var a=document.activeElement;
  if(!a || !host.contains(a)) return null;
  /* A generated id (field's "f-") is new on every paint, so it finds nothing. */
  var all=host.querySelectorAll(FOCUSABLE);
  var m={key:a.getAttribute("data-fk"), then:a.getAttribute("data-fk-then"), id:/^f-/.test(a.id)?"":a.id,
         at:Array.prototype.indexOf.call(all,a), n:all.length};
  try{ m.sel=[a.selectionStart,a.selectionEnd]; }catch(e){}
  if(a===host) m.self=true;
  return m;
}
function focusRestore(host,m){
  if(!m) return;
  var all=host.querySelectorAll(FOCUSABLE);
  var e = m.self ? host
        : m.key ? host.querySelector('[data-fk="'+m.key+'"]')||(m.then&&host.querySelector('[data-fk="'+m.then+'"]'))
        : m.id ? document.getElementById(m.id)
        : all.length===m.n ? all[m.at] : null;
  if(!e || !host.contains(e)) e=host.matches("[tabindex]")?host:null;
  if(!e) return;
  e.focus({preventScroll:true});
  if(m.sel && m.sel[0]!=null) try{ e.setSelectionRange(m.sel[0],m.sel[1]); }catch(x){}
}
/* Repaint every open card after a change. Every card paints from state and its
   draft, so this loses nothing — and the card that was just acted in shows what
   the action did. */
function repaintCard(id){
  var body=shell.body(id);
  if(!body || !cards[id]) return;
  var m=focusMark(body), top=body.scrollTop;
  cards[id].paint(body);
  body.scrollTop=top;
  focusRestore(body,m);
}
function refreshCards(){
  Object.keys(cards).forEach(function(id){ if(shell.isOpen(id)) repaintCard(id); });
}
function ctxButton(label,onClick,fk){
  var b=el("button","ctxBtn");
  b.type="button"; b.innerHTML=CTX;
  b.setAttribute("aria-label",label);
  if(fk) b.setAttribute("data-fk",fk);
  b.addEventListener("click",onClick);
  return b;
}
/* A heading inside a card. It returns itself, so a control it titles can be named
   by it (aria-labelledby). */
var fieldSeq=0;
function head(host,txt){ var h=el("div","ctxH",txt); h.id="f-"+(++fieldSeq); host.appendChild(h); return h; }
function para(host,cls,txt){ var p=el("p",cls,txt); host.appendChild(p); return p; }

/* ---- the focus card: what this session is for ---- */
/* Which slot the pinned card is about. Today the clock says: the slot of the block
   you are in, ticked or not, so a tick at the start of a session does not move the
   card on to the next one, and after the last slot it recommends nothing. Another
   day has no clock: the first slot neither ticked nor closed by an answered bell. */
function focusNow(){
  var bs=blocksFor(viewDate), fs=focusSlots(viewDate);
  if(!fs.length) return {why:"No focus slot today."};
  if(isToday()){
    var cur=currentBlockKey(), past=false, next=null;
    for(var i=0;i<bs.length;i++){
      var f=bs[i].items.filter(function(it){ return it.focus; })[0];
      if(bs[i].key===cur){ if(f) return {id:f.id,it:f}; past=true; }
      else if(past && f && !next) next={it:f,b:bs[i]};
    }
    return {why: next ? "No focus session now. The next is "+next.it.do+", after "+next.b.name+" at "+fmt(next.b.at)+"."
                      : "No focus session left today — what follows is not work."};
  }
  for(var j=0;j<fs.length;j++){
    var cb=closingBlockFor(fs[j].id);
    if(!state.items[fs[j].id] && !(cb && (state.bells||{})[cb.key])) return {id:fs[j].id,it:fs[j]};
  }
  return {why:"Every focus session on this day is recorded."};
}
function paintFocus(host,focusId){
  host.textContent="";
  var cb=closingBlockFor(focusId);

  head(host,"Selected at the next bell");
  var rec=cb?(state.bells||{})[cb.key]:null;
  if(!cb) para(host,"empty","No bell closes this slot today.");
  else if(!rec) para(host,"empty",cb.name+" at "+fmt(cb.at)+" has not been answered yet — nothing selected.");
  else{
    var names=(rec.projects||[]).concat(rec.undertakings||[]).map(projName);
    if(!names.length) para(host,"empty","Answered, with nothing picked up.");
    else names.forEach(function(n){
      var d=el("div","thread"); d.appendChild(el("b",null,n)); host.appendChild(d);
    });
  }

  head(host,"Where you pick up");
  function line(k,txt){
    var d=el("div","thread"); d.appendChild(el("b",null,projName(k)));
    d.appendChild(document.createTextNode(txt)); host.appendChild(d);
  }
  var lb=lastAnsweredBell(cb?cb.at:1440), lr=lb?(state.bells||{})[lb.key]||{}:{}, th=lr.threads||{};
  var keys=Object.keys(th).filter(function(k){ return th[k]; });
  if(keys.length){
    para(host,"prompt","From "+lb.name+(lr.answeredAt?", "+lr.answeredAt:"")+".");
    keys.forEach(function(k){ line(k,th[k]); });
  }
  /* Whatever that bell wrote nothing for is picked up where it was last left, with
     the date it was written. */
  var st=threads(), rest=[];
  PROJECTS.map(function(p){ return p.id; }).concat(Object.keys(st)).forEach(function(k){
    if(keys.indexOf(k)>=0 || rest.indexOf(k)>=0) return;
    /* A finished item's last step is history, not where anything picks up. */
    var w=anyWork(k); if(w && (w.done||w.removed)) return;
    if((st[k]&&st[k].line) || (projectStore[k]&&projectStore[k].thread)) rest.push(k);
  });
  if(rest.length){
    para(host,"prompt",keys.length?"Carried from earlier bells:":"The last one recorded on each:");
    rest.forEach(function(k){ var c=carried(k); if(c) line(k,carriedText(c)); });
  } else if(!keys.length) para(host,"empty","No bell has recorded a next step yet.");

  var mt=meetingIn(focusId,viewDate), off=mt ? null : meetingIn(focusId,viewDate,true);
  if(mt){
    head(host,"This session is a meeting");
    para(host,"prompt",mt.what+", "+fmt(hm(mt.start))+(mt.end?" to "+fmt(hm(mt.end)):"")+
      ". It takes the session"+(mt.project?" for "+projName(mt.project):"")+"; nothing is chosen for it.");
    var ma=el("div","acts");
    ma.appendChild(actButton("It did not happen — an ordinary session","no",function(){ setCancelled(mt.id,true); }));
    host.appendChild(ma);
    return;
  }
  if(off){
    para(host,"note",off.what+" did not happen this day: an ordinary session, and the meeting counts for nothing.");
    var oa=el("div","acts");
    oa.appendChild(actButton("It did happen","no",function(){ setCancelled(off.id,false); }));
    host.appendChild(oa);
  }
  head(host,"Recommended for this session");
  /* Decide while capable, and let the decision bind the later self (hypomnemata ›
     allocation): one tap takes a recommendation as the session's plan. It is kept
     beside what the bell records, never in its place, so the review can count the
     sessions where the plan held. A session already closed has nothing to plan. */
  var planned=((state.focus||{})[focusId]||{}).planned;
  var canPlan=(isToday() || viewDate>logicalToday()) && !rec;
  if(planned) para(host,"prompt","Planned: "+projName(planned)+". The next bell records what you actually worked on.");
  var firstReal=-1;
  recommend(focusId).forEach(function(r,i){
    if(!r.alongside && firstReal<0) firstReal=i;
    var c=el("div","rec"+(i===firstReal?" top":"")+(r.id && r.id===planned?" planned":""));
    c.appendChild(el("div","rank",r.alongside?"Alongside":i===firstReal?"First":"Then"));
    c.appendChild(el("div","what",r.what));
    c.appendChild(el("div","why",r.why));
    if(r.pick){
      var p=el("div","pick");
      p.appendChild(el("b",null,r.pick.what));
      p.appendChild(document.createTextNode(" — "+r.pick.why));
      c.appendChild(p);
    }
    if(canPlan && !r.alongside && r.id){
      var on=r.id===planned;
      var tk=actButton(on?"Planned":"Take this","take",function(){ planFocus(focusId,on?null:r.id); });
      tk.setAttribute("aria-pressed",String(on)); tk.setAttribute("data-fk","take:"+focusId+":"+r.id);
      tk.setAttribute("aria-label",(on?"Planned: ":"Take this: ")+r.what);
      c.appendChild(tk);
    }
    host.appendChild(c);
  });
}
function planFocus(focusId,id){
  state.focus=state.focus||{};
  var f=Object.assign({},state.focus[focusId]||{});
  if(id) f.planned=id; else delete f.planned;
  state.focus[focusId]=f;
  save(); render();
}

/* ---- the bell card: what were you working on, and where do you pick each one up ---- */
/* A bell's draft starts from its record. Until it is edited it follows the record,
   so a db sync that lands while the card is open shows what was really answered
   rather than the local copy the draft was first taken from. It is dropped when the
   card closes: an edit abandoned with the close button is abandoned. */
function draftFor(b){
  var rec=(state.bells||{})[b.key]||{}, seed=JSON.stringify(rec), d=bellDraft[b.key];
  if(!d || (!d.dirty && d.seed!==seed)){
    var th=rec.threads||{};
    d={sel:(rec.projects||[]).concat(rec.undertakings||[]),threads:{},kept:{},open:{},seed:seed,dirty:false};
    Object.keys(th).forEach(function(k){ d.threads[k]=th[k]; });
    (rec.kept||[]).forEach(function(k){ d.kept[k]=true; });
    bellDraft[b.key]=d;
  }
  return d;
}
/* BELL_LEAD (the Rule › meta.warning_bell_minutes): the
   warning rings this long before its bell. Inside it the bell has as good as rung;
   before it, an answer is early. */
/* Where a bell stands against the clock. A past day's bells have all rung, and
   what is recorded for them is recorded later; a day still to come has none to
   answer; today's has rung once its warning has — and so has the day just left,
   while a card holds the turn on it, since that card is answering it live. */
function bellState(b){
  var now=viewNow();
  if(now!=null) return b.at<=now+BELL_LEAD ? "rung" : "early";
  return viewDate<logicalToday() ? "past" : "future";
}
/* What an answer says about itself. A bell recorded later with no time given has
   no delay — that is a gap, not "on time". */
function answeredText(rec){
  if(rec.answeredAt==null) return "Recorded later · time not recorded";
  return "Answered "+rec.answeredAt+(rec.delay ? " · "+rec.delay+" min late"
       : rec.early ? " · "+rec.early+" min early" : " · on time");
}
/* The mark that a meeting did not happen on the viewed day. The session it would have
   taken is then ordinary: its bell asks what was worked on, its focus card recommends. */
function setCancelled(id,off){
  state.cancelled=state.cancelled||{};
  if(off) state.cancelled[id]=true; else delete state.cancelled[id];
  save(); render();
}
function paintBell(host,b){
  host.textContent="";
  var cl=closesFor(b,viewDate), rec=(state.bells||{})[b.key], st=bellState(b), d=draftFor(b);
  var off=cl.kind==="work" ? meetingIn(b.breaks,viewDate,true) : null;
  if(off) para(host,"note",off.what+" did not happen this day: the session was an ordinary one.");

  if(rec) para(host,"step",answeredText(rec));
  para(host,"prompt",
    cl.kind==="work"     ? "What did you work on, and where do you pick each one up? Pick each line you worked on, then write its next step or keep the one it carries. Leaving it unfinished is the point."
  : cl.kind==="sleep"    ? "This bell interrupts sleep. There is nothing to pick up, so the rite is "+words(EXIT_RITE.length-1)+" steps, not "+words(EXIT_RITE.length)+": "+
                           EXIT_RITE.slice(1).map(function(s){ return (s.short||s.do).toLowerCase(); }).join(", ")+". "+
                           (st==="past" ? "Give the time you were up only if you remember it." : "Answering records when you were actually up.")
  : cl.kind==="fixture"  ? "This bell closes "+cl.what+" — which is why it rings now and not at "+fmt(hm(b.bell))+". Nothing to pick up; answering is the rite."
  : cl.kind==="meeting"  ? "This bell closes "+cl.what+", a meeting that took the session. Nothing to pick up; answering is the rite."
  :                        "Nothing precedes this bell.");

  /* A past day's answer has no clock to read. The time is what is remembered or
     nothing — never the bell's own hour, which would record an on-time answer
     nobody gave. */
  if(st==="past"){
    var tl=el("label","fld","When you answered"); tl.htmlFor="bt-"+b.key;
    var ti=document.createElement("input");
    ti.type="time"; ti.id="bt-"+b.key;
    ti.value=d.time!=null ? d.time : (rec && rec.answeredAt ? to24(rec.answeredAt) : "");
    ti.addEventListener("input",function(){ d.time=ti.value; d.dirty=true; });
    host.appendChild(tl); host.appendChild(ti);
    para(host,"note","Leave it blank if you don't remember: a blank is kept as a gap, never as on time.");
  }

  if(cl.kind==="work"){
    /* Shown, never preselected: a plan ticked for you would be recorded as kept by
       anyone who taps Save without reading. */
    var pl=((state.focus||{})[b.breaks]||{}).planned;
    if(pl) para(host,"note","Planned for this session: "+projName(pl)+".");
    var list=el("div"); host.appendChild(list);
    var fc=focusCounts();
    PROJECTS.forEach(function(pr){
      list.appendChild(bellLine(pr,false,fc,b));
      /* A project's work items wait behind its "Other work", all but those already
         picked, so the answer sits a short screen down whatever the TODO list holds. */
      var kids=rankWork(pr.id,b.breaks).filter(function(r){ return r.step!=="meeting"; });
      var open=!!d.open[pr.id], hid=kids.filter(function(r){ return d.sel.indexOf(r.o.id)<0; }).length;
      if(hid){
        var mb=actButton(open?"Hide other work for "+pr.what:"Other work for "+pr.what+" ("+hid+")","more",function(){
          d.open[pr.id]=!open; repaintCard("bell:"+b.key); });
        mb.setAttribute("aria-expanded",String(open)); mb.setAttribute("data-fk","more:"+pr.id);
        list.appendChild(mb);
      }
      kids.forEach(function(r){ if(open || d.sel.indexOf(r.o.id)>=0) list.appendChild(bellLine(r.o,true,fc,b)); });
    });
  }

  var acts=el("div","acts");
  if(st==="future") para(host,"empty","This bell has not rung. It is answered on its day.");
  else if(d.withdraw){
    para(host,"note","Withdrawing deletes this answer"+(cl.kind==="work"?", what it recorded for the session and the tick it made":
      cl.kind==="sleep"?" and the sleep delay it recorded":"")+
      ". Next steps it wrote stay as each line's latest.");
    acts.appendChild(actButton("Withdraw it","go",function(){ withdrawBell(b); }));
    acts.appendChild(actButton("Keep it","no",function(){ d.withdraw=false; repaintCard("bell:"+b.key); }));
  } else {
    /* A bell not yet rung takes an answer — early is allowed — but the button says
       so, and a stray tap on the wrong bell's card cannot pass for one. */
    acts.appendChild(actButton(rec ? "Save"
      : st==="past" ? "Record this bell"
      : st==="early" ? "Answer early — it rings at "+fmt(b.at)
      : cl.kind==="work" ? "Answered — leave it unfinished" : "Answered","go",function(){ commitBell(b); }));
    if(rec) acts.appendChild(actButton("Withdraw the answer","no",function(){ d.withdraw=true; repaintCard("bell:"+b.key); }));
    if(cl.kind==="meeting") acts.appendChild(actButton("It did not happen — an ordinary session","no",function(){ setCancelled(cl.id,true); }));
    if(off) acts.appendChild(actButton("It did happen","no",function(){ setCancelled(off.id,false); }));
  }
  if(acts.firstChild) host.appendChild(acts);

  /* The resume line is for work left unfinished. A bell that closes sleep, a
     fixture or nothing has nothing to pick up, and its rite is the rest
     (hypomnemata › bell). */
  head(host,"The exit rite");
  var ol=el("ol","rite");
  (cl.kind==="work"?EXIT_RITE:EXIT_RITE.slice(1)).forEach(function(s){ ol.appendChild(el("li",null,s.short||s.do)); });
  host.appendChild(ol);
  para(host,"note",cl.kind==="work"
    ? "Identical whatever you are exiting — that invariance is the mechanism. "+
      "It applies inside a session too, every time a project blocks and you switch to another."
    : "The same "+words(EXIT_RITE.length-1)+" moves close every bell; a bell that closes work adds the resume line first.");
}
function bellLine(o,isKid,fc,b){
  var d=draftFor(b), on=d.sel.indexOf(o.id)>=0;
  var wrap=el("div","pline"+(isKid?" kidline":"")+(on?" on":""));
  /* A button, so the desk's keyboard picks a line as a finger does. */
  var headEl=el("button","phead");
  headEl.type="button"; headEl.setAttribute("aria-pressed",String(on)); headEl.setAttribute("data-fk","bl:"+o.id);
  headEl.innerHTML='<span class="pbox" aria-hidden="true">'+TICK+'</span>';
  headEl.appendChild(el("span","pname",o.what));
  if(!isKid){
    headEl.appendChild(el("span","pcount",countText(fc[o.id]||0)+"/"+allocOf(o)));
  }
  headEl.addEventListener("click",function(){
    var i=d.sel.indexOf(o.id);
    if(i>=0) d.sel.splice(i,1); else d.sel.push(o.id);
    d.dirty=true;
    repaintCard("bell:"+b.key);   /* a picked line opens its next step */
  });
  wrap.appendChild(headEl);

  if(o.follow) return wrap;   /* a follow-up has no next step: it is one */
  if(o.question){
    /* A frontier question's next step is the notebook's, read there and never typed. */
    if(webLink(o.notebook)){
      var nb=el("a","dwhy","Read and answer it at the notebook.");
      nb.href=o.notebook; nb.target="_blank"; nb.rel="noopener"; wrap.appendChild(nb);
    }
    return wrap;
  }
  if(isDictation(o)){
    /* A dictation's next step is the notebook's dictate entry point; it is let go on
       the dictations card, and never given a line here. */
    wrap.appendChild(el("div","dwhy","Run it through the notebook's dictate entry point, then let it go on the dictations card."));
    return wrap;
  }
  /* Only a picked line asks for its next step. The line it carries is shown as
     carried, dated, and kept with a tap — not typed into the field, where a line
     still right and a line nobody wrote looked the same, and a week-old one was
     handed back as fresh. */
  if(!on) return wrap;
  var c=carried(o.id);
  if(c){
    var cr=el("div","carried");
    cr.appendChild(el("span",null,"Carried: "+carriedText(c)));
    var kb=el("button","keep","Still right");
    kb.type="button"; kb.setAttribute("aria-pressed",String(!!d.kept[o.id]));
    kb.setAttribute("aria-label","Still right: "+c.line); kb.setAttribute("data-fk","keep:"+o.id);
    kb.addEventListener("click",function(){
      d.kept[o.id]=!d.kept[o.id]; d.dirty=true; kb.setAttribute("aria-pressed",String(d.kept[o.id]));
    });
    cr.appendChild(kb);
    wrap.appendChild(cr);
  }
  var inp=document.createElement("input");
  inp.type="text"; inp.placeholder=c?"Or a new next step":"The next thing — where you pick up";
  inp.setAttribute("aria-label","Next step for "+o.what); inp.setAttribute("data-fk","next:"+o.id);
  inp.value=d.threads[o.id]||"";
  inp.addEventListener("input",function(){ d.threads[o.id]=inp.value; d.dirty=true; });
  wrap.appendChild(inp);
  return wrap;
}
/* The line a thing carries in from its last bell, and when that was written, so a
   line six days old reads as six days old. */
function carried(id){
  var line=threadLine(id), t=threads()[id], p=projectStore[id], at=null;
  if(!line) return null;
  var o=todoStore[id]||periodicStore[id];
  if(t && t.line===line) at=t.at; else if(p && p.thread===line) at=p.threadAt||p.at;
  else if(o && o.next===line) at=o.nextAt||o.at;
  return {line:line,at:at};
}
function carriedText(c){
  var d=c.at?new Date(c.at):null;
  if(!d || isNaN(d)) return c.line;
  var n=daysBetween(logicalDay(d),logicalToday());
  return c.line+" · "+d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+
    (n>1?", "+n+" days ago":n===1?", yesterday":"");
}
function commitBell(b){
  var d=draftFor(b), prev=(state.bells||{})[b.key], st=bellState(b), at=null;
  if(st==="future") return;
  var projIds=PROJECTS.map(function(p){return p.id;});
  /* Built over the old record, so a field this page does not write (a backfill's
     note) survives an edit. */
  var rec=Object.assign({},prev||{},{
    projects: d.sel.filter(function(id){return projIds.indexOf(id)>=0;}),
    undertakings: d.sel.filter(function(id){return projIds.indexOf(id)<0;}),
    threads: {}
  });
  /* Saving an edit is not answering again: when the bell was answered, and how late,
     stay as they were — the delay is the measurement. Only a time given on a past
     day's card changes them, and a past day's time is only ever the one given. */
  if(!prev || (st==="past" && d.time!=null)){
    at = st==="past" ? (d.time ? hm(d.time) : null) : viewNow();
    /* A time typed on a past day's card before the day starts (04:00) was after
       midnight. Today's answer is nowMins(), which already runs past 24:00 then;
       an early answer, however early, stays early. */
    if(st==="past" && at!=null && at<hm(DAY_START)) at+=1440;
    rec.answeredAt = at==null ? null : fmt(at);
    rec.delay = at==null ? null : Math.max(0, at-b.at);
    /* Early is kept apart from the delay, which is read everywhere as minutes late. */
    if(at!=null && at<b.at) rec.early=b.at-at; else delete rec.early;
    if(!prev && st==="past") rec.backfilled=true;
  }
  /* A line saved again unchanged is not written again: its date is how old it is. */
  var was=(prev&&prev.threads)||{};
  Object.keys(d.threads).forEach(function(id){
    var v=(d.threads[id]||"").trim();
    if(v && d.sel.indexOf(id)>=0){ rec.threads[id]=v; if(was[id]!==v) setThread(id,v); }
  });
  /* A carried line kept as still right is recorded as kept: not rewritten, and not
     confused with a line nobody looked at. */
  var kept=d.sel.filter(function(id){ return d.kept[id] && !rec.threads[id]; });
  if(kept.length) rec.kept=kept; else delete rec.kept;
  var cl=closesFor(b,viewDate);
  rec.closes=cl.kind==="none"?null:(cl.id||cl.kind);
  if(cl.kind!=="work"){ rec.projects=[]; rec.undertakings=[]; rec.threads={}; delete rec.kept; }
  /* Lauds closes sleep, and how late it closes IS the gated-sleep measurement —
     the only thing worth recording about a bell with nothing to pick up. An unknown
     delay records nothing, and an answer long before the bell was not a rising. */
  if(cl.kind==="sleep"){
    var ex=(state.delays||{}).exit_sleep;
    if(typeof rec.delay==="number" && !(rec.early>BELL_LEAD)){ state.delays=state.delays||{}; state.delays.exit_sleep=rec.delay; }
    else if(prev && ex!=null && ex===prev.delay) delete state.delays.exit_sleep;
  }
  state.bells=state.bells||{};
  state.bells[b.key]=rec;
  /* the bell closes the PRIOR focus slot — record it there too. The slot ends at
     its bell, or at the answer when that came first: never at an hour still to come.
     A tick the bell made is marked, so withdrawing the answer takes it back. */
  /* A meeting took the session: its bell ticks the slot, and records no work. */
  if(cl.kind==="meeting"){
    if(!state.items[b.breaks]){ state.items[b.breaks]=true; rec.ticked=true; }
    else rec.ticked=!!prev && bellTicked(prev,b);
  }
  if(cl.kind==="work"){
    state.focus=state.focus||{};
    state.focus[b.breaks]=Object.assign({},state.focus[b.breaks]||{},
      {projects:rec.projects,undertakings:rec.undertakings});
    if(!state.items[b.breaks]){ state.items[b.breaks]=true; rec.ticked=true; }
    else rec.ticked=!!prev && bellTicked(prev,b);
    state.times=state.times||{};
    /* a past day's first answer with no time remembered stamps no time: the bell's
       own hour would record an on-time finish nobody gave */
    if(!state.times[b.breaks] && !(st==="past" && !prev && at==null))
      state.times[b.breaks]=fmt(at!=null && at<b.at ? at : b.at);
  }
  save();
  shell.close("bell:"+b.key);
  render();
}
/* Whether an answer made its slot's tick. This page says so on the record, either
   way. An older page did not say: it ticked the slot on every answer and stamped
   it at the bell's own hour, so a tick with that time is its. */
function bellTicked(rec,b){
  if(rec.ticked!=null) return !!rec.ticked;
  return !!state.items[b.breaks] && (state.times||{})[b.breaks]===fmt(b.at);
}
/* Take an answer back: the record, what it put on the focus slot, the tick it made,
   and Lauds' sleep delay. A next step it wrote has already become that line's latest
   and stays. What the session was planned for is not the answer's, and stays too. */
function withdrawBell(b){
  var rec=(state.bells||{})[b.key];
  if(!rec) return;
  var cl=closesFor(b,viewDate);
  delete state.bells[b.key];
  if(cl.kind==="work"){
    var f=(state.focus||{})[b.breaks];
    if(f){ f=Object.assign({},f); delete f.projects; delete f.undertakings;
      if(Object.keys(f).length) state.focus[b.breaks]=f; else delete state.focus[b.breaks]; }
    if(bellTicked(rec,b)){ state.items[b.breaks]=false; if(state.times) delete state.times[b.breaks]; }
  }
  /* A meeting's session was ticked by its bell and nothing else. */
  if(cl.kind==="meeting" && bellTicked(rec,b)){ state.items[b.breaks]=false; if(state.times) delete state.times[b.breaks]; }
  if(cl.kind==="sleep" && state.delays && state.delays.exit_sleep===rec.delay) delete state.delays.exit_sleep;
  save();
  shell.close("bell:"+b.key);
  render();
}

/* ---- the row card: everything about one item that is not its tick ----
   Time, the reason it is not needed, a group's steps, the weight, the Examen, the
   focus docket. None of it sits on the row any more, which is what got the row back
   down to a tick and a name. */
function rowId(it){ return "row:"+it.id; }
/* "11:00 PM" -> "23:00", for <input type=time>. Returns "" on anything unexpected
   so the field falls back to now rather than opening blank-and-broken. */
function to24(s){
  var m=/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec(s||"");
  if(!m) return "";
  var h=+m[1]%12; if(/pm/i.test(m[3])) h+=12;
  return String(h).padStart(2,"0")+":"+m[2];
}
/* A time taken off by an untick is kept a while: an untick that was a mis-tap, put
   right within ten minutes, gets the real time back, not the time it was put right.
   Later, a tick today is a new doing and is stamped now; on a past day nothing is
   stamped, so the old time is all there is. */
var untimed={};
function markDone(it,on){
  (on?openLeaves(it):leaves(it)).forEach(function(k){
    var key=state.date+":"+k.id, u=untimed[key];
    state.items[k.id]=on;
    state.times=state.times||{};
    if(on){
      var t=u && (!isToday() || nowMins()-u.when<10) ? u.t : stamp();
      if(t && !state.times[k.id]) state.times[k.id]=t;
      delete untimed[key];
    }
    else if(state.times[k.id]){ untimed[key]={t:state.times[k.id],when:nowMins()}; delete state.times[k.id]; }
  });
  if(it.id==="meds") state.meds=on;
}

/* When it was done. Every ticked item can have its time set, not only the ones
   with nothing else to say: on a past day nothing is stamped, so this is the only
   way one gets a time at all. A group's parts each get their own, under their own
   name: that they happen at different times is why they are parts. */
function paintTime(host,it,label){
  var gs=groupState(it), dr=draft(rowId(it));
  var th=head(host,label||"Time");
  if(!gs.all) para(host,"empty","Recorded when you tick it. You can set one here either way.");
  var ti=document.createElement("input");
  ti.type="time"; ti.id="at-"+it.id; ti.setAttribute("aria-labelledby",th.id);
  var cur=dr.time!=null ? dr.time : to24((state.times||{})[it.id]);
  if(!cur && dr.time==null){ var d=new Date();
    cur=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
  ti.value=cur;
  ti.addEventListener("input",function(){ dr.time=ti.value; });
  host.appendChild(ti);
  var ta=el("div","acts");
  var tg=el("button","go","Set the time"); tg.type="button";
  tg.addEventListener("click",function(){
    var val=ti.value||"";
    if(!/^\d{1,2}:\d{2}$/.test(val)) return;
    state.times=state.times||{};
    state.times[it.id]=fmt(hm(val));
    delete dr.time;
    save(); render();
  });
  ta.appendChild(tg);
  if((state.times||{})[it.id]){
    var tc=el("button","no","Clear"); tc.type="button";
    tc.addEventListener("click",function(){
      delete state.times[it.id]; delete dr.time; save(); render();
    });
    ta.appendChild(tc);
  }
  host.appendChild(ta);
}

function paintRow(host,it){
  host.textContent="";
  var b=blockedBy(it,state.date), isGroup=!!(it.children&&it.children.length), dr=draft(rowId(it));

  if(b) host.appendChild(el("div","blockedNote",blockedLine(b)));
  var dx=!b && notExpectedOn(it,state.date);
  if(dx) para(host,"prompt",notExpectedText(dx));
  if(it.sub) para(host,"prompt",it.sub);
  if(it.floor) para(host,"prompt",floorCount(it,state.date)+" of "+it.floor+" this week.");

  if(it.focus){
    var f=el("div"); host.appendChild(f); paintFocus(f,it.id);
    /* The bell that closes the slot ticks it. This is for a slot no bell closed —
       a past day's, or one with none — and for taking back a tick made by mistake. */
    var fon=!!state.items[it.id], fa=el("div","acts");
    fa.appendChild(actButton(fon?"Undo — not done":"Mark done","no",function(){
      markDone(it,!fon); save(); render(); }));
    host.appendChild(fa);
    if(fon) paintTime(host,it);
    return;
  }

  if(it.value){
    head(host,"Weigh in");
    /* Only this day's own reading is filled in. Yesterday's number in the field is
       the comparison the Rule rules out, and one tap would record it as today's. */
    var v=(typeof state.weight==="number")?state.weight:null;
    var wi=document.createElement("input");
    wi.type="number"; wi.step=String(it.step||"any"); wi.inputMode="decimal"; wi.id="wtVal"; wi.setAttribute("data-autofocus","");
    wi.setAttribute("aria-label","Weight in "+it.value);
    wi.value = dr.weight!=null ? dr.weight : (v===null?"":v);
    wi.addEventListener("input",function(){ dr.weight=wi.value; });
    host.appendChild(wi);
    var wa=el("div","acts"), wg=el("button","go","Record "+it.value);
    wg.type="button";
    wg.addEventListener("click",function(){
      var n=parseFloat(wi.value);
      if(!isFinite(n)||n<=0) return;
      state.weight=Math.round(n*10)/10;
      markDone(it,true);
      save(); shell.close(rowId(it)); render();
    });
    wa.appendChild(wg);
    /* A reading recorded by mistake can be taken off, back to no reading at all. */
    if(typeof state.weight==="number"){
      var wr=el("button","no","Remove"); wr.type="button";
      wr.addEventListener("click",function(){
        /* null, not deleted: a merge that carries the record elsewhere cannot
           carry an absence. */
        state.weight=null; delete dr.weight; markDone(it,false);
        save(); render();
      });
      wa.appendChild(wr);
    }
    host.appendChild(wa);
    if(state.items[it.id]) paintTime(host,it);
    return;
  }

  if(it.examen){
    paintExamen(host,it);
    if(state.items[it.id]) paintTime(host,it);
    return;
  }

  if(isGroup){
    head(host,"Steps");
    it.children.forEach(function(k){
      var kb=el("button","kidrow");
      kb.type="button"; kb.setAttribute("data-fk","kid:"+k.id);
      kb.setAttribute("aria-pressed", state.items[k.id]?"true":"false");
      kb.innerHTML='<span class="tick">'+TICK+'</span>';
      kb.appendChild(el("span","lbl",k.do));
      var kt=(state.times||{})[k.id], kbl=blockedBy(k,state.date);
      if(kt) kb.appendChild(el("i","at",kt));
      if(kbl){ kb.disabled=true; kb.title="Blocked — "+kbl.what; kb.appendChild(el("span","flag","Blocked")); host.appendChild(kb); return; }
      kb.addEventListener("click",function(){
        markDone(k,!state.items[k.id]);
        save(); render();
      });
      host.appendChild(kb);
    });
  }

  if(!isGroup) paintTime(host,it);
  else it.children.forEach(function(k){ if(state.items[k.id]) paintTime(host,k,"Time — "+k.do); });

  /* Two kinds of item can be not needed. A nullable one is required unless it is declared
     not needed, and the reason is the record. An optional one (a ledger condition
     the page cannot see, like groceries) is not needed in the normal case: one tap,
     no explanation. hypomnemata › deviation. */
  if(it.nullable || it.optional){
    var nh=head(host,"Not needed today");
    var naVal=(state.na||{})[it.id];
    if(naVal){
      para(host,"prompt",notNeededText(naVal));
      var ua=el("div","acts"), ub=el("button","no","Undo");
      ub.type="button";
      ub.addEventListener("click",function(){
        /* The reason goes back in the field, so an undo you did not mean is one
           tap to redo. */
        if(typeof naVal==="string") dr.why=naVal;
        delete state.na[it.id]; save(); render();
      });
      ua.appendChild(ub); host.appendChild(ua);
    } else if(it.optional){
      var oa=el("div","acts"), ob=el("button","no","Not needed today");
      ob.type="button";
      ob.addEventListener("click",function(){
        state.na=state.na||{}; state.times=state.times||{};
        state.items[it.id]=false; delete state.times[it.id];
        state.na[it.id]=true;
        save(); shell.close(rowId(it)); render();
      });
      oa.appendChild(ob); host.appendChild(oa);
    } else {
      para(host,"prompt","Say why. A nullable item that is genuinely not needed is not a miss — but the reason is the record.");
      var why=document.createElement("textarea");
      why.id="na-"+it.id; why.placeholder="Why it is not needed"; why.setAttribute("aria-labelledby",nh.id);
      why.value=dr.why||"";
      why.addEventListener("input",function(){ dr.why=why.value; });
      host.appendChild(why);
      var na=el("div","acts"), nb=el("button","no","Not needed today");
      nb.type="button";
      nb.addEventListener("click",function(){
        state.na=state.na||{}; state.times=state.times||{};
        state.items[it.id]=false; delete state.times[it.id];
        state.na[it.id]=(why.value||"").trim()||true;
        save(); shell.close(rowId(it)); render();
      });
      na.appendChild(nb); host.appendChild(na);
    }
  }
}

function paintExamen(host,it){
  var s=EXAMEN[exIdx];
  para(host,"step","Step "+(exIdx+1)+" of "+EXAMEN.length);
  para(host,"prompt",s.p);
  var l=el("label","fld",s.t); l.setAttribute("for","exInput"); host.appendChild(l);
  /* The text as typed lives in the card's draft, as every card's does; the day gets
     it trimmed. Refilled from the trimmed copy, a repaint (another device's write)
     would take the space just typed and glue the next word on. */
  var dr=draft(rowId(it)); dr.ex=dr.ex||{};
  var ta=document.createElement("textarea");
  ta.id="exInput"; ta.value=dr.ex[s.k]!=null ? dr.ex[s.k] : (state.examen||{})[s.k]||""; ta.setAttribute("data-autofocus","");
  ta.addEventListener("input",function(){
    dr.ex[s.k]=ta.value;
    state.examen=state.examen||{};
    state.examen[s.k]=ta.value.trim();
    save();
  });
  host.appendChild(ta);
  var acts=el("div","acts");
  if(exIdx>0){
    var back=el("button","no","Back"); back.type="button"; back.setAttribute("data-fk","ex:back");
    back.addEventListener("click",function(){ exIdx--; repaintCard(rowId(it)); });
    acts.appendChild(back);
  }
  var next=el("button","go",exIdx===EXAMEN.length-1?"Close the day":"Next");
  next.type="button"; next.setAttribute("data-fk","ex:next");
  next.addEventListener("click",function(){
    if(exIdx<EXAMEN.length-1){ exIdx++; repaintCard(rowId(it)); return; }
    markDone(it,true); save(); shell.close(rowId(it)); render();
  });
  acts.appendChild(next);
  host.appendChild(acts);
}

/* ---- blocked: the open TODO items that name what they stop ---- */
function paintBlocked(host){
  host.textContent="";
  var open=todoAll().filter(function(x){ return (x.blocks||[]).length; });
  if(!open.length){ para(host,"empty","Nothing is blocked."); return; }
  open.forEach(function(x){
    var card=el("div","rec");
    card.appendChild(el("div","what",x.what));
    card.appendChild(el("div","why","Blocks: "+(x.blocks||[]).map(labelOf).join(", ")+
      " — blocked while this is open."+(isRepair(x)?" "+repairStatus(x):"")));
    var acts=el("div","acts"), btn=el("button","no","Resolved");
    btn.type="button";
    btn.addEventListener("click",function(){ closeTodo(x.id,logicalToday()); render(); });
    var edit=el("button","no","Open in the TODO list"); edit.type="button";
    edit.addEventListener("click",function(){ openTodo(x.project,x.id); });
    /* An owned item is closed by its owner, never here (hypomnemata › undertaking). */
    if(ownerOf(x)) acts.appendChild(el("span","why",ownerOf(x)+" closes it."));
    else acts.appendChild(btn);
    /* a project's TODO list holds only the items that name it */
    if(x.project) acts.appendChild(edit);
    card.appendChild(acts);
    host.appendChild(card);
  });
}
/* Said beside the button that could not act, in place of doing nothing. */
function nudge(host,txt){
  var n=host.parentNode.querySelector(".nudge");
  if(!n){ n=el("p","nudge"); n.setAttribute("role","status"); host.parentNode.insertBefore(n,host.nextSibling); }
  n.textContent=txt;
}

/* ===== the docket's cards ======================================================
   Three per project, each opened from its row: the project (allocation, next step,
   links, the work in order), its TODO list, its dictations and its periodic items. Every
   edit lands in the store at once; the sitting reads it back into the Rule. */
/* A label and what it labels, tied together: a control by for/id, so it is named
   and a tap on the label reaches it; anything else ("It blocks", a read-only value)
   as a group the label names. `fk` names the control for focusRestore: a card
   repainted while you type in it — a change from another device — puts the cursor
   back in this field, wherever the repaint has moved it. */
function field(host,label,node,fk){
  var l=el("label","fld",label);
  if(fk) node.setAttribute("data-fk",fk);
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(node.tagName)){ if(!node.id) node.id="f-"+(++fieldSeq); l.htmlFor=node.id; }
  else{ l.id="f-"+(++fieldSeq); node.setAttribute("role","group"); node.setAttribute("aria-labelledby",l.id); }
  host.appendChild(l); host.appendChild(node); return node;
}
function textInput(v,ph){ var i=document.createElement("input"); i.type="text"; i.value=v||""; if(ph) i.placeholder=ph; return i; }
function dateInput(v){ var i=document.createElement("input"); i.type="date"; i.value=v||""; return i; }
function numInput(v,min){ var i=document.createElement("input"); i.type="number"; i.min=min||0; i.value=v==null?"":v; return i; }
function actButton(label,cls,fn){ var b=el("button",cls,label); b.type="button"; b.addEventListener("click",fn); return b; }
function linksFor(host,p){
  var row=el("div","links");
  function link(txt,href){ if(!webLink(href)) return; var a=el("a",null,txt); a.href=href; a.target="_blank"; a.rel="noopener"; row.appendChild(a); }
  if(p.repo) link("Repo",p.repo);
  /* A repo on one of the devices is named, never linked: a phone cannot open it. */
  else if(p.checkout){ row.appendChild(el("span","local","Repo "+p.checkout)); }
  if(p.calendar) link("Calendar","https://calendar.google.com/calendar/r?cid="+encodeURIComponent(p.calendar));
  if(p.notebook) link("Hypomnemata",p.notebook);
  if(row.childNodes.length) host.appendChild(row);
}
/* A shared slot makes a count fractional; the dots round it, the label says halves. */
function allocDots(used,total,meet){
  var u=Math.round(used), w=el("span","alloc"), n=Math.max(total,u);
  w.setAttribute("role","img"); w.setAttribute("aria-label",countText(used)+" of "+total+" this week"+(meet?", "+plural(meet,"meeting")+" counted":""));
  for(var i=0;i<n;i++){
    var d=el("i");
    if(i<meet) d.className="meet"; else if(i<u) d.className="used";
    if(i>=total) d.classList.add("over");
    w.appendChild(d);
  }
  return w;
}
/* A blocker and what it stops are drawn as one bound pair: the blocker's row says
   what it stops, and the row after it, what stops it. */
function workRow(host,r){
  var o=r.o, isD=isDictation(o), cls="dkid"+(o.question||isD?" canon":"")+((o.blocks||[]).length?" blocker":"")+(r.binds?" bound":"")+(r.boundBy?" boundto":"");
  var row=el("div",cls);
  row.appendChild(el("b",null,o.what));
  if(r.why) row.appendChild(el("span","dwhy",r.why));
  if(r.binds) row.appendChild(el("span","dbind","Stops "+r.bindsWhat+", below."));
  if(o.question) row.appendChild(el("div","next none","Read and answered at the notebook."));
  else if(isD) row.appendChild(el("div","next none",invocation(o)));
  else if(!o.meeting) nextLine(row,o.id,r.step==="later");
